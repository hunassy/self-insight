<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分析 - Self Insight</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div class="container py-4" style="max-width: 600px; padding-bottom: 80px !important;">

    <!-- タイトル -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h1 class="fs-4 fw-bold mb-1">Self Insight</h1>
        <p class="text-muted mb-0">分析</p>
      </div>
    </div>

    <!-- 最近のパターン -->
    <div class="card mb-3">
      <div class="card-body">
        <h2 class="fs-6 fw-bold mb-3">最近のパターン <span class="text-muted fw-normal small">（直近30日）</span></h2>
        <div id="recent-patterns">
          <p class="text-muted">読み込み中...</p>
        </div>
      </div>
    </div>

    <!-- 7日間の傾向 -->
    <div class="card mb-3">
      <div class="card-body">
        <h2 class="fs-6 fw-bold mb-3">7日間の傾向</h2>
        <div id="weekly-trend">
          <p class="text-muted">読み込み中...</p>
        </div>
      </div>
    </div>

    <!-- 自分の傾向 -->
    <div class="card mb-3">
      <div class="card-body">
        <h2 class="fs-6 fw-bold mb-3">自分の傾向 <span class="text-muted fw-normal small">（全期間）</span></h2>
        <div id="all-patterns">
          <p class="text-muted">読み込み中...</p>
        </div>
      </div>
    </div>

    <!-- 個別分析 -->
    <div class="card mb-3">
      <div class="card-body">
        <h2 class="fs-6 fw-bold mb-3">個別分析</h2>

        <!-- 回復要因分析 -->
        <div class="border-bottom pb-2 mb-2">
          <div class="fw-bold small mb-1" style="cursor:pointer;"
            onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'block' : 'none'">
            ▶ 回復要因分析
          </div>
          <div style="display:none;" id="detail-recovery"></div>
        </div>

        <!-- 悪化トリガー分析 -->
        <div class="border-bottom pb-2 mb-2">
          <div class="fw-bold small mb-1" style="cursor:pointer;"
            onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'block' : 'none'">
            ▶ 悪化トリガー分析
          </div>
          <div style="display:none;" id="detail-trigger"></div>
        </div>

        <!-- 安定パターン分析 -->
        <div class="border-bottom pb-2 mb-2">
          <div class="fw-bold small mb-1" style="cursor:pointer;"
            onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'block' : 'none'">
            ▶ 安定パターン分析
          </div>
          <div style="display:none;" id="detail-stable"></div>
        </div>

        <!-- 睡眠と状態 -->
        <div class="border-bottom pb-2 mb-2">
          <div class="fw-bold small mb-1" style="cursor:pointer;"
            onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'block' : 'none'">
            ▶ 睡眠と状態の関係
          </div>
          <div style="display:none;" id="detail-sleep"></div>
        </div>

        <!-- 外出と状態 -->
        <div class="border-bottom pb-2 mb-2">
          <div class="fw-bold small mb-1" style="cursor:pointer;"
            onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'block' : 'none'">
            ▶ 外出と状態の関係
          </div>
          <div style="display:none;" id="detail-outing"></div>
        </div>

        <!-- 交流と状態 -->
        <div class="border-bottom pb-2 mb-2">
          <div class="fw-bold small mb-1" style="cursor:pointer;"
            onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'block' : 'none'">
            ▶ 交流と状態の関係
          </div>
          <div style="display:none;" id="detail-social"></div>
        </div>

        <!-- 作業時間と状態 -->
        <div class="border-bottom pb-2 mb-2">
          <div class="fw-bold small mb-1" style="cursor:pointer;"
            onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'block' : 'none'">
            ▶ 作業時間と状態の関係
          </div>
          <div style="display:none;" id="detail-work"></div>
        </div>

        <!-- 天気と状態 -->
        <div class="border-bottom pb-2 mb-2">
          <div class="fw-bold small mb-1" style="cursor:pointer;"
            onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'block' : 'none'">
            ▶ 天気と状態の関係
          </div>
          <div style="display:none;" id="detail-weather"></div>
        </div>

        <!-- 気圧と状態 -->
        <div class="pb-2">
          <div class="fw-bold small mb-1" style="cursor:pointer;"
            onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'block' : 'none'">
            ▶ 気圧と状態の関係
          </div>
          <div style="display:none;" id="detail-pressure"></div>
        </div>

      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // ============================
    // データの読み込み
    // ============================

    var STORAGE_KEY = 'selfInsightRecords';

    function loadRecords() {
      var data = localStorage.getItem(STORAGE_KEY);
      if (data === null) return [];
      return JSON.parse(data);
    }

    // ============================
    // 日付ヘルパー
    // ============================

    // 今日の日付文字列を返す（2026-06-06形式）
    function getTodayString() {
      return new Date().toISOString().split('T')[0];
    }

    // 指定日付からN日前の日付文字列を返す
    function getDaysAgo(baseDate, n) {
      var d = new Date(baseDate);
      d.setDate(d.getDate() - n);
      return d.toISOString().split('T')[0];
    }

    // ============================
    // スコアのヘルパー
    // ============================

    // 信頼度ラベルを返す
    function getConfidenceLabel(count) {
      if (count >= 20) return '信頼度：高';
      if (count >= 10) return '信頼度：中';
      if (count >= 5)  return '信頼度：低';
      return null;
    }

    // 差分から傾向テキストを返す
    function getTrendLabel(diff) {
      if (diff >= 1.0) return '強い傾向あり';
      if (diff >= 0.5) return '傾向あり';
      return null;
    }

    // スコアの平均を計算する
    function average(arr) {
      if (arr.length === 0) return null;
      var sum = arr.reduce(function(a, b) { return a + b; }, 0);
      return sum / arr.length;
    }

    // ============================
    // 分析用データを絞り込む
    // ============================

    // 朝・夜両方あるレコードのみ返す
    function getValidRecords(records) {
      return records.filter(function(r) {
        return r.morning && r.evening && r.scores &&
          r.scores.physical !== undefined;
      });
    }

    // 直近N日のレコードを返す
    function getRecentRecords(records, days) {
      var today = getTodayString();
      var from  = getDaysAgo(today, days);
      return records.filter(function(r) {
        return r.date >= from && r.date <= today;
      });
    }

    // ============================
    // 個別分析の表示
    // ============================

    // グループごとのスコア平均を表示するHTML
    function renderDetailTable(groups) {
      var html = '<table class="table table-sm mt-2">';
      html += '<thead><tr>';
      html += '<th class="text-muted fw-normal small">条件</th>';
      html += '<th class="text-muted fw-normal small">件数</th>';
      html += '<th class="text-muted fw-normal small">体調</th>';
      html += '<th class="text-muted fw-normal small">メンタル</th>';
      html += '<th class="text-muted fw-normal small">活力</th>';
      html += '</tr></thead><tbody>';

      groups.forEach(function(g) {
        var physical = average(g.records.map(function(r) { return r.scores.physical; }));
        var mental   = average(g.records.map(function(r) { return r.scores.mental; }));
        var energy   = average(g.records.map(function(r) { return r.scores.eveningEnergy; }));

        html += '<tr>';
        html += '<td class="small">' + g.label + '</td>';
        html += '<td class="small text-muted">' + g.records.length + '件</td>';
        html += '<td class="small">' + (physical !== null ? physical.toFixed(1) : '-') + '</td>';
        html += '<td class="small">' + (mental   !== null ? mental.toFixed(1)   : '-') + '</td>';
        html += '<td class="small">' + (energy   !== null ? energy.toFixed(1)   : '-') + '</td>';
        html += '</tr>';
      });

      html += '</tbody></table>';
      return html;
    }

    // データ不足メッセージ
    function notEnoughData() {
      return '<p class="text-muted small mt-2">データが少ないため表示できません（5件以上記録すると表示されます）</p>';
    }

    // ============================
    // 回復要因分析
    // ============================

    function showDetailRecovery(validRecords) {
      var container = document.getElementById('detail-recovery');

      // 日付順に並べる
      var sorted = validRecords.slice().sort(function(a, b) {
        return a.date > b.date ? 1 : -1;
      });

      // 前日スコアが低かった日の翌日を探す
      var recoveryDays = [];
      for (var i = 0; i < sorted.length - 1; i++) {
        var today = sorted[i];
        var tomorrow = sorted[i + 1];

        // 前日のスコアが低い（体調かメンタルがマイナス）
        var isBadDay = today.scores.physical < 0 || today.scores.mental < 0;
        if (!isBadDay) continue;

        // 翌日が連続した日付かチェック
        var todayDate    = new Date(today.date);
        var tomorrowDate = new Date(tomorrow.date);
        var diffDays = (tomorrowDate - todayDate) / (1000 * 60 * 60 * 24);
        if (diffDays !== 1) continue;

        recoveryDays.push({
          prev: today,
          next: tomorrow
        });
      }

      if (recoveryDays.length < 5) {
        container.innerHTML = notEnoughData();
        return;
      }

      // 翌日に回復した日（eveningEnergyが上昇）としなかった日に分ける
      var recovered    = recoveryDays.filter(function(d) { return d.next.scores.eveningEnergy > 0; });
      var notRecovered = recoveryDays.filter(function(d) { return d.next.scores.eveningEnergy <= 0; });

      // 回復した日の行動パターンを集計する
      var recoveredOuting   = recovered.filter(function(d) { return d.next.evening.outing === 'した'; }).length;
      var recoveredSocial   = recovered.filter(function(d) { return d.next.evening.socializing === 'あった'; }).length;
      var recoveredSleep    = recovered.filter(function(d) { return d.next.morning.sleepHours >= 6.5; }).length;

      var html = '<div class="mt-2">';
      html += '<div class="small text-muted mb-2">前日に体調・メンタルが低下した翌日（' + recoveryDays.length + '件）</div>';

      if (recovered.length > 0) {
        html += '<div class="mb-1">回復した日の行動：</div>';
        html += '<div class="small">・睡眠6.5時間以上：' + recoveredSleep + '件 / ' + recovered.length + '件</div>';
        html += '<div class="small">・外出あり：' + recoveredOuting + '件 / ' + recovered.length + '件</div>';
        html += '<div class="small">・交流あり：' + recoveredSocial + '件 / ' + recovered.length + '件</div>';
      } else {
        html += '<div class="text-muted small">回復した日のデータがまだ少ないです</div>';
      }

      html += '</div>';
      container.innerHTML = html;
    }

    // ============================
    // 悪化トリガー分析
    // ============================

    function showDetailTrigger(validRecords) {
      var container = document.getElementById('detail-trigger');

      if (validRecords.length < 5) {
        container.innerHTML = notEnoughData();
        return;
      }

      // スコアが低い日を「悪化した日」とする
      var badDays = validRecords.filter(function(r) {
        return r.scores.eveningEnergy < 0 || r.scores.mental < 0;
      });

      if (badDays.length < 5) {
        container.innerHTML = notEnoughData();
        return;
      }

      // 悪化した日の行動パターンを集計する
      var shortSleep  = badDays.filter(function(r) { return r.morning.sleepHours < 6; }).length;
      var noOuting    = badDays.filter(function(r) { return r.evening.outing === 'しなかった'; }).length;
      var noSocial    = badDays.filter(function(r) { return r.evening.socializing === 'なかった'; }).length;
      var longWork    = badDays.filter(function(r) { return r.evening.workHours >= 7; }).length;
      var noWork      = badDays.filter(function(r) { return r.evening.workHours === 0; }).length;

      var html = '<div class="mt-2">';
      html += '<div class="small text-muted mb-2">活力・メンタルが低下した日（' + badDays.length + '件）の行動：</div>';
      html += '<div class="small">・睡眠6時間未満：' + shortSleep + '件 / ' + badDays.length + '件</div>';
      html += '<div class="small">・外出なし：' + noOuting + '件 / ' + badDays.length + '件</div>';
      html += '<div class="small">・交流なし：' + noSocial + '件 / ' + badDays.length + '件</div>';
      html += '<div class="small">・作業7時間以上：' + longWork + '件 / ' + badDays.length + '件</div>';
      html += '<div class="small">・作業なし：' + noWork + '件 / ' + badDays.length + '件</div>';
      html += '</div>';

      container.innerHTML = html;
    }

    // ============================
    // 安定パターン分析
    // ============================

    function showDetailStable(validRecords) {
      var container = document.getElementById('detail-stable');

      if (validRecords.length < 5) {
        container.innerHTML = notEnoughData();
        return;
      }

      // 安定した日：体調・メンタル・活力がすべてプラスの日
      var stableDays = validRecords.filter(function(r) {
        return r.scores.physical >= 0 &&
               r.scores.mental >= 0 &&
               r.scores.eveningEnergy > 0;
      });

      if (stableDays.length < 5) {
        container.innerHTML = notEnoughData();
        return;
      }

      // 安定した日の行動パターンを集計する
      var sleep7     = stableDays.filter(function(r) { return r.morning.sleepHours >= 7; }).length;
      var outing     = stableDays.filter(function(r) { return r.evening.outing === 'した'; }).length;
      var social     = stableDays.filter(function(r) { return r.evening.socializing === 'あった'; }).length;
      var work3to4   = stableDays.filter(function(r) { return r.evening.workHours >= 3 && r.evening.workHours <= 4; }).length;

      var avgSleep   = average(stableDays.map(function(r) { return r.morning.sleepHours; }));
      var avgWork    = average(stableDays.map(function(r) { return r.evening.workHours; }));

      var html = '<div class="mt-2">';
      html += '<div class="small text-muted mb-2">体調・メンタル・活力が安定した日（' + stableDays.length + '件）：</div>';
      html += '<div class="small">・平均睡眠時間：' + (avgSleep !== null ? avgSleep.toFixed(1) : '-') + '時間</div>';
      html += '<div class="small">・平均作業時間：' + (avgWork  !== null ? avgWork.toFixed(1)  : '-') + '時間</div>';
      html += '<div class="small">・外出あり：' + outing + '件 / ' + stableDays.length + '件</div>';
      html += '<div class="small">・交流あり：' + social + '件 / ' + stableDays.length + '件</div>';
      html += '<div class="small">・睡眠7時間以上：' + sleep7 + '件 / ' + stableDays.length + '件</div>';
      html += '<div class="small">・作業3〜4時間：' + work3to4 + '件 / ' + stableDays.length + '件</div>';
      html += '</div>';

      container.innerHTML = html;
    }

    // ============================
    // 天気と状態の分析
    // ============================

    function showDetailWeather(validRecords) {
      var container = document.getElementById('detail-weather');

      if (validRecords.length < 5) {
        container.innerHTML = notEnoughData();
        return;
      }

      // 天気データがあるレコードのみ絞り込む
      var weatherRecords = validRecords.filter(function(r) {
        return r.morning && r.morning.weather;
      });

      if (weatherRecords.length < 5) {
        container.innerHTML = notEnoughData();
        return;
      }

      // 天気グループに分ける
      var sunny  = weatherRecords.filter(function(r) { return r.morning.weather === '快晴' || r.morning.weather === '晴れ'; });
      var cloudy = weatherRecords.filter(function(r) { return r.morning.weather === '曇り'; });
      var rainy  = weatherRecords.filter(function(r) {
        return r.morning.weather === '雨' || r.morning.weather === '霧雨' || r.morning.weather === 'にわか雨' || r.morning.weather === '雷雨';
      });

      var groups = [
        { label: '晴れ', records: sunny },
        { label: '曇り', records: cloudy },
        { label: '雨',   records: rainy }
      ];

      container.innerHTML = renderDetailTable(groups);
    }

    // ============================
    // 気圧と状態の分析
    // ============================

    function showDetailPressure(validRecords) {
      var container = document.getElementById('detail-pressure');

      if (validRecords.length < 5) {
        container.innerHTML = notEnoughData();
        return;
      }

      // 気圧データがあるレコードのみ絞り込む
      var pressureRecords = validRecords.filter(function(r) {
        return r.morning && r.morning.pressure;
      });

      if (pressureRecords.length < 5) {
        container.innerHTML = notEnoughData();
        return;
      }

      // 気圧グループに分ける
      var low    = pressureRecords.filter(function(r) { return r.morning.pressure < 1000; });
      var normal = pressureRecords.filter(function(r) { return r.morning.pressure >= 1000 && r.morning.pressure < 1013; });
      var high   = pressureRecords.filter(function(r) { return r.morning.pressure >= 1013; });

      var groups = [
        { label: '低い（1000未満）',      records: low },
        { label: '普通（1000〜1013）',    records: normal },
        { label: '高い（1013以上）',      records: high }
      ];

      container.innerHTML = renderDetailTable(groups);
    }

    // 睡眠と状態の個別分析
    function showDetailSleep(validRecords) {
      var container = document.getElementById('detail-sleep');
      if (validRecords.length < 5) {
        container.innerHTML = notEnoughData();
        return;
      }

      var groups = [
        { label: '6時間未満', records: validRecords.filter(function(r) { return r.morning.sleepHours < 6; }) },
        { label: '6〜7時間',  records: validRecords.filter(function(r) { return r.morning.sleepHours >= 6 && r.morning.sleepHours < 7; }) },
        { label: '7時間以上', records: validRecords.filter(function(r) { return r.morning.sleepHours >= 7; }) }
      ];

      container.innerHTML = renderDetailTable(groups);
    }

    // 外出と状態の個別分析
    function showDetailOuting(validRecords) {
      var container = document.getElementById('detail-outing');
      if (validRecords.length < 5) {
        container.innerHTML = notEnoughData();
        return;
      }

      var groups = [
        { label: '外出した',      records: validRecords.filter(function(r) { return r.evening.outing === 'した'; }) },
        { label: '外出しなかった', records: validRecords.filter(function(r) { return r.evening.outing === 'しなかった'; }) }
      ];

      container.innerHTML = renderDetailTable(groups);
    }

    // 交流と状態の個別分析
    function showDetailSocial(validRecords) {
      var container = document.getElementById('detail-social');
      if (validRecords.length < 5) {
        container.innerHTML = notEnoughData();
        return;
      }

      var groups = [
        { label: '交流あった',   records: validRecords.filter(function(r) { return r.evening.socializing === 'あった'; }) },
        { label: '交流なかった', records: validRecords.filter(function(r) { return r.evening.socializing === 'なかった'; }) }
      ];

      container.innerHTML = renderDetailTable(groups);
    }

    // 作業時間と状態の個別分析
    function showDetailWork(validRecords) {
      var container = document.getElementById('detail-work');
      if (validRecords.length < 5) {
        container.innerHTML = notEnoughData();
        return;
      }

      var groups = [
        { label: '0時間',    records: validRecords.filter(function(r) { return r.evening.workHours === 0; }) },
        { label: '1〜3時間', records: validRecords.filter(function(r) { return r.evening.workHours > 0 && r.evening.workHours <= 3; }) },
        { label: '4〜6時間', records: validRecords.filter(function(r) { return r.evening.workHours > 3 && r.evening.workHours <= 6; }) },
        { label: '7時間以上', records: validRecords.filter(function(r) { return r.evening.workHours > 6; }) }
      ];

      container.innerHTML = renderDetailTable(groups);
    }

    // ============================
    // パターン発見（最近・全期間共通）
    // ============================

    // 候補パターンを全部試してスコア差分が大きい順に返す
    function findPatterns(validRecords, topN) {

      var results = [];

      // --- 睡眠 ---
      var sleepShort  = validRecords.filter(function(r) { return r.morning.sleepHours < 6; });
      var sleepMiddle = validRecords.filter(function(r) { return r.morning.sleepHours >= 6 && r.morning.sleepHours < 7; });
      var sleepLong   = validRecords.filter(function(r) { return r.morning.sleepHours >= 7; });

      [
        { group: sleepLong,   other: sleepShort,  label: '睡眠7時間以上の日は', metric: 'eveningEnergy', metricLabel: '活力が高い' },
        { group: sleepShort,  other: sleepLong,   label: '睡眠6時間未満の日は', metric: 'eveningEnergy', metricLabel: '活力が低い' },
        { group: sleepLong,   other: sleepShort,  label: '睡眠7時間以上の日は', metric: 'mental',        metricLabel: 'メンタルが安定する' },
      ].forEach(function(pattern) {
        if (pattern.group.length < 5 || pattern.other.length < 5) return;
        var avg1 = average(pattern.group.map(function(r) { return r.scores[pattern.metric]; }));
        var avg2 = average(pattern.other.map(function(r) { return r.scores[pattern.metric]; }));
        if (avg1 === null || avg2 === null) return;
        var diff = avg1 - avg2;
        if (diff < 0.5) return;
        results.push({ label: pattern.label, metricLabel: pattern.metricLabel, diff: diff, count: pattern.group.length });
      });

      // --- 外出 ---
      var wentOut   = validRecords.filter(function(r) { return r.evening.outing === 'した'; });
      var stayedIn  = validRecords.filter(function(r) { return r.evening.outing === 'しなかった'; });

      [
        { group: wentOut,  other: stayedIn, label: '外出した日は', metric: 'mental',        metricLabel: 'メンタルが安定する' },
        { group: wentOut,  other: stayedIn, label: '外出した日は', metric: 'eveningEnergy', metricLabel: '活力が高い' },
        { group: stayedIn, other: wentOut,  label: '外出しなかった日は', metric: 'mental',  metricLabel: 'メンタルが低下しやすい' },
      ].forEach(function(pattern) {
        if (pattern.group.length < 5 || pattern.other.length < 5) return;
        var avg1 = average(pattern.group.map(function(r) { return r.scores[pattern.metric]; }));
        var avg2 = average(pattern.other.map(function(r) { return r.scores[pattern.metric]; }));
        if (avg1 === null || avg2 === null) return;
        var diff = avg1 - avg2;
        if (diff < 0.5) return;
        results.push({ label: pattern.label, metricLabel: pattern.metricLabel, diff: diff, count: pattern.group.length });
      });

      // --- 交流 ---
      var hadSocial = validRecords.filter(function(r) { return r.evening.socializing === 'あった'; });
      var noSocial  = validRecords.filter(function(r) { return r.evening.socializing === 'なかった'; });

      [
        { group: hadSocial, other: noSocial, label: '交流があった日は', metric: 'mental',        metricLabel: 'メンタルが安定する' },
        { group: hadSocial, other: noSocial, label: '交流があった日は', metric: 'eveningEnergy', metricLabel: '活力が高い' },
      ].forEach(function(pattern) {
        if (pattern.group.length < 5 || pattern.other.length < 5) return;
        var avg1 = average(pattern.group.map(function(r) { return r.scores[pattern.metric]; }));
        var avg2 = average(pattern.other.map(function(r) { return r.scores[pattern.metric]; }));
        if (avg1 === null || avg2 === null) return;
        var diff = avg1 - avg2;
        if (diff < 0.5) return;
        results.push({ label: pattern.label, metricLabel: pattern.metricLabel, diff: diff, count: pattern.group.length });
      });

      // --- 作業時間 ---
      var work1to3 = validRecords.filter(function(r) { return r.evening.workHours > 0 && r.evening.workHours <= 3; });
      var work4to6 = validRecords.filter(function(r) { return r.evening.workHours > 3 && r.evening.workHours <= 6; });
      var work0    = validRecords.filter(function(r) { return r.evening.workHours === 0; });

      [
        { group: work4to6, other: work0, label: '作業時間4〜6時間の日は', metric: 'eveningEnergy', metricLabel: '活力が高い' },
        { group: work4to6, other: work0, label: '作業時間4〜6時間の日は', metric: 'mental',        metricLabel: 'メンタルが安定する' },
        { group: work0,    other: work4to6, label: '作業しなかった日は',   metric: 'eveningEnergy', metricLabel: '活力が低い' },
      ].forEach(function(pattern) {
        if (pattern.group.length < 5 || pattern.other.length < 5) return;
        var avg1 = average(pattern.group.map(function(r) { return r.scores[pattern.metric]; }));
        var avg2 = average(pattern.other.map(function(r) { return r.scores[pattern.metric]; }));
        if (avg1 === null || avg2 === null) return;
        var diff = avg1 - avg2;
        if (diff < 0.5) return;
        results.push({ label: pattern.label, metricLabel: pattern.metricLabel, diff: diff, count: pattern.group.length });
      });

      // 差分が大きい順に並べてtopN件返す
      results.sort(function(a, b) { return b.diff - a.diff; });
      return results.slice(0, topN);
    }

    // パターンをHTMLで表示する
    function renderPatterns(patterns) {
      if (patterns.length === 0) {
        return '<p class="text-muted small">まだパターンが見つかりません（データが増えると表示されます）</p>';
      }

      var html = '';
      patterns.forEach(function(p, i) {
        var trendLabel      = getTrendLabel(p.diff);
        var confidenceLabel = getConfidenceLabel(p.count);
        html += '<div class="mb-2">';
        html += '<div>① '.replace('①', '①②③④⑤'.charAt(i));
        html += p.label + p.metricLabel + '傾向があります</div>';
        html += '<div class="text-muted small">';
        if (trendLabel)      html += trendLabel + '　';
        if (confidenceLabel) html += confidenceLabel + '（' + p.count + '件）';
        html += '</div>';
        html += '</div>';
      });
      return html;
    }

    // ============================
    // 最近のパターン
    // ============================

    function showRecentPatterns(records) {
      var container   = document.getElementById('recent-patterns');
      var validAll    = getValidRecords(records);
      var recent30    = getRecentRecords(validAll, 30);
      var patterns    = findPatterns(recent30, 3);
      container.innerHTML = renderPatterns(patterns);
    }

    // ============================
    // 自分の傾向
    // ============================

    function showAllPatterns(records) {
      var container = document.getElementById('all-patterns');
      var validAll  = getValidRecords(records);
      var patterns  = findPatterns(validAll, 5);
      container.innerHTML = renderPatterns(patterns);
    }

    // ============================
    // 7日間の傾向
    // ============================

    function showWeeklyTrend(records) {
      var container = document.getElementById('weekly-trend');
      var validAll  = getValidRecords(records);
      var today     = getTodayString();

      // 今週（直近7日）と先週（8〜14日前）に分ける
      var thisWeek = getRecentRecords(validAll, 7);
      var lastWeekFrom = getDaysAgo(today, 14);
      var lastWeekTo   = getDaysAgo(today, 8);
      var lastWeek = validAll.filter(function(r) {
        return r.date >= lastWeekFrom && r.date <= lastWeekTo;
      });

      if (thisWeek.length === 0) {
        container.innerHTML = '<p class="text-muted">直近7日の記録がありません</p>';
        return;
      }

      var html = '';

      // 外出日数の比較
      var thisWeekOuting = thisWeek.filter(function(r) { return r.evening.outing === 'した'; }).length;
      var lastWeekOuting = lastWeek.filter(function(r) { return r.evening.outing === 'した'; }).length;
      html += '<div class="mb-2">';
      html += '<div class="small text-muted">外出日数</div>';
      if (lastWeek.length > 0) {
        html += '<div>' + lastWeekOuting + '日 → ' + thisWeekOuting + '日</div>';
      } else {
        html += '<div>' + thisWeekOuting + '日</div>';
      }
      html += '</div>';

      // 作業時間の比較
      var thisWeekWork = average(thisWeek.map(function(r) { return r.evening.workHours || 0; }));
      var lastWeekWork = average(lastWeek.map(function(r) { return r.evening.workHours || 0; }));
      html += '<div class="mb-2">';
      html += '<div class="small text-muted">作業時間（平均）</div>';
      if (lastWeek.length > 0 && lastWeekWork !== null) {
        html += '<div>' + lastWeekWork.toFixed(1) + '時間 → ' + thisWeekWork.toFixed(1) + '時間</div>';
      } else {
        html += '<div>' + thisWeekWork.toFixed(1) + '時間</div>';
      }
      html += '</div>';

      // 活力の比較
      var thisWeekEnergy = average(thisWeek.map(function(r) { return r.scores.eveningEnergy; }));
      var lastWeekEnergy = average(lastWeek.map(function(r) { return r.scores.eveningEnergy; }));
      html += '<div class="mb-2">';
      html += '<div class="small text-muted">活力スコア（平均）</div>';
      if (lastWeek.length > 0 && lastWeekEnergy !== null) {
        var energyDiff = thisWeekEnergy - lastWeekEnergy;
        var energyLabel = energyDiff > 0.3 ? '上昇' : energyDiff < -0.3 ? '低下' : 'ほぼ変化なし';
        html += '<div>' + lastWeekEnergy.toFixed(1) + ' → ' + thisWeekEnergy.toFixed(1) + '　(' + energyLabel + ')</div>';
      } else {
        html += '<div>' + (thisWeekEnergy !== null ? thisWeekEnergy.toFixed(1) : '-') + '</div>';
      }
      html += '</div>';

      container.innerHTML = html;
    }

    // ============================
    // 実行
    // ============================

    var records = loadRecords();

    showRecentPatterns(records);
    showWeeklyTrend(records);
    showAllPatterns(records);

    var validRecords = getValidRecords(records);
    showDetailRecovery(validRecords);
    showDetailTrigger(validRecords);
    showDetailStable(validRecords);
    showDetailSleep(validRecords);
    showDetailOuting(validRecords);
    showDetailSocial(validRecords);
    showDetailWork(validRecords);
    showDetailWeather(validRecords);
    showDetailPressure(validRecords);

  </script>
