<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分析 - Self Insight</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

  <style>
    /* ============================
       カラー設定
       色を変えたいときはここだけ修正する
    ============================ */
    :root {
      --color-primary:    #6B4F5E;
      --color-primary-hover: #8B6675;
      --color-bg:         #F7F4F5;
      --color-selected-text: #ffffff;
      --color-primary-soft: rgba(107, 79, 94, 0.12);
    }

    body {
      background-color: var(--color-bg);
      font-family: 'Noto Sans JP', sans-serif;
    }

    /* ボタン */
    .btn-primary {
      background-color: var(--color-primary) !important;
      border-color: var(--color-primary) !important;
    }

    .btn-primary:hover {
      background-color: var(--color-primary-hover) !important;
      border-color: var(--color-primary-hover) !important;
    }

    /* 7日間の傾向：グループの見出し */
    .weekly-group-label {
      font-size: 0.75rem;
      color: var(--color-primary-hover);
      font-weight: 500;
      margin: 0 0 8px;
      padding-left: 2px;
    }

    /* 7日間の傾向：カードを2列に並べる枠 */
    .weekly-card-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 18px;
    }

    /* 7日間の傾向：1枚のカード */
    .weekly-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 2px 8px rgba(107, 79, 94, 0.18);
    }

    /* 7日間の傾向：横幅いっぱいに広げたいカード用（開始時刻など） */
    .weekly-card-full {
      grid-column: span 2;
    }

    /* 7日間の傾向：アイコンの丸バッジ */
    .weekly-card-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--color-primary-soft);
      color: var(--color-primary);
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* 7日間の傾向：項目名 */
    .weekly-card-label {
      font-size: 0.75rem;
      color: var(--color-primary-hover);
    }

    /* 7日間の傾向：今週の値（大きい数字） */
    .weekly-card-value {
      font-size: 1.375rem;
      font-weight: 500;
      color: #3D2B33;
      margin-top: 6px;
    }

    /* 7日間の傾向：先週との差 */
    .weekly-card-diff {
      font-size: 0.6875rem;
      color: #B0A0AA;
      margin-top: 2px;
    }

    /* 7日間の傾向：「調子」だけを目立たせるカード */
    .weekly-card-summary {
      background: #ffffff;
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 8px;
      box-shadow: 0 2px 8px rgba(107, 79, 94, 0.18);
    }

    .weekly-card-summary .weekly-card-icon {
      width: 32px;
      height: 32px;
      background: var(--color-primary-soft);
      font-size: 16px;
    }

    .weekly-card-summary .weekly-card-value {
      font-size: 1.75rem;
    }

    /* 7日間の傾向：体調・メンタル・活力を3列に並べる枠 */
    .weekly-card-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 18px;
    }

    /* 7日間の傾向：3列時の小さめ表示（調子の内訳であることを示す） */
    .weekly-card-sub .weekly-card-value {
      font-size: 1.125rem;
    }

    .weekly-card-sub .weekly-card-label {
      font-size: 0.6875rem;
    }

  </style>
</head>
<body>

  <div class="container py-4" style="max-width: 600px; padding-bottom: 80px !important;">

    <!-- タイトル -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h1 class="fs-4 fw-bold mb-1">Self Insight</h1>
        <p class="text-muted mb-0">分析</p>
      </div>
    </div>

    <!-- 最近の発見 -->
    <div class="card mb-3">
      <div class="card-body">
        <h2 class="fs-6 fw-bold mb-3">最近の発見 <span class="text-muted fw-normal small">（直近30日）</span></h2>
        <div id="recent-patterns">
          <p class="text-muted">読み込み中...</p>
        </div>
      </div>
    </div>

    <!-- 7日間の傾向 -->
    <div class="card mb-3">
      <div class="card-body">
        <h2 class="fs-6 fw-bold mb-3">7日間の傾向</h2>
        <div id="weekly-trend">
          <p class="text-muted">読み込み中...</p>
        </div>
      </div>
    </div>

    <!-- 長期の傾向 -->
    <div class="card mb-3">
      <div class="card-body">
        <h2 class="fs-6 fw-bold mb-3">長期の傾向 <span class="text-muted fw-normal small">（全期間）</span></h2>
        <div id="all-patterns">
          <p class="text-muted">読み込み中...</p>
        </div>
      </div>
    </div>

    <!-- 個別分析 -->
    <div class="card mb-3">
      <div class="card-body">
        <h2 class="fs-6 fw-bold mb-3">個別分析</h2>

        <!-- 回復要因分析 -->
        <div class="border-bottom pb-2 mb-2">
          <div class="fw-bold small mb-1" style="cursor:pointer;"
            onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'block' : 'none'">
            ▶ 回復要因分析
          </div>
          <div style="display:none;" id="detail-recovery"></div>
        </div>

        <!-- 悪化トリガー分析 -->
        <div class="border-bottom pb-2 mb-2">
          <div class="fw-bold small mb-1" style="cursor:pointer;"
            onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'block' : 'none'">
            ▶ 悪化トリガー分析
          </div>
          <div style="display:none;" id="detail-trigger"></div>
        </div>

        <!-- 安定パターン分析 -->
        <div class="border-bottom pb-2 mb-2">
          <div class="fw-bold small mb-1" style="cursor:pointer;"
            onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'block' : 'none'">
            ▶ 安定パターン分析
          </div>
          <div style="display:none;" id="detail-stable"></div>
        </div>

        <!-- 曜日別の活動時間 -->
        <div class="border-bottom pb-2 mb-2">
          <div class="fw-bold small mb-1" style="cursor:pointer;"
            onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'block' : 'none'">
            ▶ 曜日別の活動時間
          </div>
          <div style="display:none;" id="detail-weekday"></div>
        </div>

        <!-- 開始時刻帯の分析 -->
        <div class="border-bottom pb-2 mb-2">
          <div class="fw-bold small mb-1" style="cursor:pointer;"
            onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'block' : 'none'">
            ▶ 開始時刻帯の分析
          </div>
          <div style="display:none;" id="detail-start-time"></div>
        </div>

        <!-- 活動時間と状態の分析 -->
        <div class="border-bottom pb-2 mb-2">
          <div class="fw-bold small mb-1" style="cursor:pointer;"
            onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'block' : 'none'">
            ▶ 活動時間と状態の分析
          </div>
          <div style="display:none;" id="detail-work"></div>
        </div>

        <!-- 天気・気圧と状態の分析 -->
        <div class="pb-2 mb-2">
          <div class="fw-bold small mb-1" style="cursor:pointer;"
            onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'block' : 'none'">
            ▶ 天気・気圧と状態の分析
          </div>
          <div style="display:none;">
            <div class="text-muted small mt-2 mb-1">天気</div>
            <div id="detail-weather"></div>
            <div class="text-muted small mt-3 mb-1">気圧</div>
            <div id="detail-pressure"></div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // ============================
    // データの読み込み
    // ============================

    var STORAGE_KEY = 'selfInsightRecords';

    function loadRecords() {
      var data = localStorage.getItem(STORAGE_KEY);
      if (data === null) return [];
      return JSON.parse(data);
    }

    // ============================
    // 日付ヘルパー
    // ============================

    // 今日の日付文字列を返す（2026-06-06形式）
    function getTodayString() {
      return new Date().toISOString().split('T')[0];
    }

    // 指定日付からN日前の日付文字列を返す
    function getDaysAgo(baseDate, n) {
      var d = new Date(baseDate);
      d.setDate(d.getDate() - n);
      return d.toISOString().split('T')[0];
    }

    // 日付文字列（例：2026-06-03）を「6/3」の形式に変換する
    function formatDateMD(dateString) {
      var parts = dateString.split('-');
      var month = Number(parts[1]);
      var day   = Number(parts[2]);
      return month + '/' + day;
    }

    // ============================
    // スコアのヘルパー
    // ============================

    // 信頼度ラベルを返す
    function getConfidenceLabel(count) {
      if (count >= 20) return '信頼度：高';
      if (count >= 10) return '信頼度：中';
      if (count >= 5)  return '信頼度：低';
      return null;
    }

    // 差分から傾向テキストを返す
    function getTrendLabel(diff) {
      if (diff >= 1.0) return '強い傾向あり';
      if (diff >= 0.5) return '傾向あり';
      return null;
    }

    // dayRatingを数値に変換する共通関数
    // good（良い日）=1点、normal（普通の日）=0点、bad（つらい日）=-1点
    function dayRatingToScore(r) {
      if (r.evening.dayRating === 'good')   return 1;
      if (r.evening.dayRating === 'normal') return 0;
      if (r.evening.dayRating === 'bad')    return -1;
      return 0;
    }

    // データ不足メッセージ
    function notEnoughData() {
      return '<p class="text-muted small mt-2">データが少ないため表示できません（5件以上記録すると表示されます）</p>';
    }

    // スコアの平均を計算する
    function average(arr) {
      if (arr.length === 0) return null;
      var sum = arr.reduce(function(a, b) { return a + b; }, 0);
      return sum / arr.length;
    }

    // 活動時間を取得する（新旧どちらのデータ形式でも読めるようにする）
    // 新しい記録 → workDuration を見る
    // 古い記録   → workHours を見る
    function populateActivityDurationOptions(record) {
      if (record.evening.workDuration !== undefined) {
        return record.evening.workDuration;
      }
      return record.evening.workHours || 0;
    }

    // ============================
    // 分析用データを絞り込む
    // ============================

    function getValidRecords(records) {
      return records.filter(function(r) {
        // dayRatingがある夜の記録があるレコードだけ対象にする
        return r.evening &&
          (r.evening.dayRating === 'good' ||
           r.evening.dayRating === 'normal' ||
           r.evening.dayRating === 'bad');
      });
    }

    // 直近N日のレコードを返す
    function getRecentRecords(records, days) {
      var today = getTodayString();
      var from  = getDaysAgo(today, days);
      return records.filter(function(r) {
        return r.date >= from && r.date <= today;
      });
    }

    // グループごとのスコア平均を表示するHTML
    function renderDetailTable(groups) {
      var html = '<table class="table table-sm mt-2">';
      html += '<thead><tr>';
      html += '<th class="text-muted fw-normal small">条件</th>';
      html += '<th class="text-muted fw-normal small">件数</th>';
      html += '<th class="text-muted fw-normal small">体調</th>';
      html += '<th class="text-muted fw-normal small">メンタル</th>';
      html += '<th class="text-muted fw-normal small">活力</th>';
      html += '<th class="text-muted fw-normal small">調子</th>';
      html += '</tr></thead><tbody>';

      groups.forEach(function(g) {

        // 体調・メンタル・活力はscoresがある記録だけを平均の対象にする
        // （scoresは朝の記録がある日だけ計算されているため、無い日はundefinedになる）
        var physicalList = g.records
          .map(function(r) { return r.scores ? r.scores.physical : undefined; })
          .filter(function(v) { return v !== undefined && v !== null; });
        var mentalList = g.records
          .map(function(r) { return r.scores ? r.scores.mental : undefined; })
          .filter(function(v) { return v !== undefined && v !== null; });
        var energyList = g.records
          .map(function(r) { return r.scores ? r.scores.eveningEnergy : undefined; })
          .filter(function(v) { return v !== undefined && v !== null; });

        var physical = average(physicalList);
        var mental   = average(mentalList);
        var energy   = average(energyList);

        // 調子（dayRating）の平均を計算する
        var dayRating = average(g.records.map(function(r) { return dayRatingToScore(r); }));

        html += '<tr>';
        html += '<td class="small">' + g.label + '</td>';
        html += '<td class="small text-muted">' + g.records.length + '件</td>';
        html += '<td class="small">' + (physical  !== null ? physical.toFixed(1)  : '-') + '</td>';
        html += '<td class="small">' + (mental    !== null ? mental.toFixed(1)    : '-') + '</td>';
        html += '<td class="small">' + (energy    !== null ? energy.toFixed(1)    : '-') + '</td>';
        html += '<td class="small">' + (dayRating !== null ? dayRating.toFixed(1) : '-') + '</td>';
        html += '</tr>';
      });

      html += '</tbody></table>';

      // 列が増えて横幅が広くなったため、横スクロールできる枠で囲む
      return '<div class="table-responsive">' + html + '</div>';
    }

    // 割合を計算してテキストで返す（0件のときは「-%」を返す）
    function toPercent(count, total) {
      if (total === 0) return '-%';
      return Math.round(count / total * 100) + '%（' + total + '件中' + count + '件）';
    }

    // 配列項目の出現割合を集計して件数順に返す
    function countItems(records, field, allItems) {
      var counts = allItems.map(function(item) {
        var count = records.filter(function(r) {
          return (r.evening[field] || []).indexOf(item) !== -1;
        }).length;
        return { item: item, count: count };
      });
      // 件数が多い順に並べて0件は除外する
      counts.sort(function(a, b) { return b.count - a.count; });
      return counts.filter(function(c) { return c.count > 0; });
    }

    // ============================
    // 回復要因分析
    // ============================

    function showDetailRecovery(validRecords) {
      var container = document.getElementById('detail-recovery');

      // 日付順に並べる
      var sorted = validRecords.slice().sort(function(a, b) {
        return a.date > b.date ? 1 : -1;
      });

      // 前日スコアが低かった日の翌日を探す
      var recoveryDays = [];
      for (var i = 0; i < sorted.length - 1; i++) {
        var today = sorted[i];
        var tomorrow = sorted[i + 1];

        // 前日が「つらい日」だったか（dayRating基準）
        var isBadDay = today.evening.dayRating === 'bad';
        if (!isBadDay) continue;

        // 翌日が連続した日付かチェック
        var todayDate    = new Date(today.date);
        var tomorrowDate = new Date(tomorrow.date);
        var diffDays = (tomorrowDate - todayDate) / (1000 * 60 * 60 * 24);
        if (diffDays !== 1) continue;

        recoveryDays.push({
          prev: today,
          next: tomorrow
        });
      }

      if (recoveryDays.length < 5) {
        container.innerHTML = notEnoughData();
        return;
      }

      // 翌日に回復した日（良い日 or 普通の日になった）としなかった日（つらい日のまま）に分ける
      var recovered = recoveryDays.filter(function(d) {
        return d.next.evening.dayRating === 'good' || d.next.evening.dayRating === 'normal';
      });
      var notRecovered = recoveryDays.filter(function(d) { 
        return d.next.evening.dayRating === 'bad'; 
      });

      // 回復した日の行動パターンを集計する
      var recoveredOuting   = recovered.filter(function(d) { return d.next.evening.outing === 'した'; }).length;
      var recoveredSocial   = recovered.filter(function(d) { return d.next.evening.socializing === 'あった'; }).length;
      var recoveredSleep    = recovered.filter(function(d) { return d.next.morning.sleepHours >= 6.5; }).length;

      var html = '<div class="mt-2">';
      html += '<div class="small text-muted mb-2">前日に体調・メンタルが低下した翌日（' + recoveryDays.length + '件）</div>';

      if (recovered.length > 0) {
        html += '<div class="mb-1">回復した日の行動：</div>';
        html += '<div class="small">・睡眠6.5時間以上：' + toPercent(recoveredSleep, recovered.length) + '</div>';
        html += '<div class="small">・外出あり：' + toPercent(recoveredOuting, recovered.length) + '</div>';
        html += '<div class="small">・交流あり：' + toPercent(recoveredSocial, recovered.length) + '</div>';
      }

      html += '</div>';

      // 回復した日のdone集計を追加する
      if (recovered.length > 0) {
        var doneItems = ['活動できた', '外出できた', '人と話せた', '家事できた', '趣味ができた', 'ゆっくり休めた'];
        var doneCounts = countItems(recovered.map(function(d) { return d.next; }), 'done', doneItems);
        if (doneCounts.length > 0) {
          html += '<div class="mt-2 mb-1">回復した日によく記録されたこと：</div>';
          doneCounts.forEach(function(c) {
            html += '<div class="small">・' + c.item + '：' + toPercent(c.count, recovered.length) + '</div>';
          });
        }
      }

      container.innerHTML = html;
    }

    // ============================
    // 悪化トリガー分析
    // ============================

    function showDetailTrigger(validRecords) {
      var container = document.getElementById('detail-trigger');

      if (validRecords.length < 5) {
        container.innerHTML = notEnoughData();
        return;
      }

      // その日の総合評価が「つらい日」だった日を「悪化した日」とする
      var badDays = validRecords.filter(function(r) {
        return r.evening.dayRating === 'bad';
      });

      if (badDays.length < 5) {
        container.innerHTML = notEnoughData();
        return;
      }

      // 悪化した日の行動パターンを集計する
      var shortSleep  = badDays.filter(function(r) { return r.morning.sleepHours < 6; }).length;
      var noOuting    = badDays.filter(function(r) { return r.evening.outing === 'しなかった'; }).length;
      var noSocial    = badDays.filter(function(r) { return r.evening.socializing === 'なかった'; }).length;
      var longWork    = badDays.filter(function(r) { return populateActivityDurationOptions(r) >= 7; }).length;
      var noWork      = badDays.filter(function(r) { return populateActivityDurationOptions(r) === 0; }).length;

      var html = '<div class="mt-2">';
      html += '<div class="small text-muted mb-2">活力・メンタルが低下した日（' + badDays.length + '件）の行動：</div>';
      html += '<div class="small">・睡眠6時間未満：' + toPercent(shortSleep, badDays.length) + '</div>';
      html += '<div class="small">・外出なし：' + toPercent(noOuting, badDays.length) + '</div>';
      html += '<div class="small">・交流なし：' + toPercent(noSocial, badDays.length) + '</div>';
      html += '<div class="small">・活動7時間以上：' + toPercent(longWork, badDays.length) + '</div>';
      html += '<div class="small">・活動なし：' + toPercent(noWork, badDays.length) + '</div>';

      html += '</div>';

      // つらい日のhard集計を追加する
      var hardItems = ['疲れた', '不安が強い', '落ち込み', '人間関係', '睡眠不足', '体調不良', '仕事のストレス'];
      var hardCounts = countItems(badDays, 'hard', hardItems);
      if (hardCounts.length > 0) {
        html += '<div class="mt-2 mb-1">つらい日に多かったこと：</div>';
        hardCounts.forEach(function(c) {
          html += '<div class="small">・' + c.item + '：' + toPercent(c.count, badDays.length) + '</div>';
        });
      }

      container.innerHTML = html;
    }

    // ============================
    // 安定パターン分析
    // ============================

    function showDetailStable(validRecords) {
      var container = document.getElementById('detail-stable');
      if (!container) return;

      if (validRecords.length < 5) {
        container.innerHTML = notEnoughData();
        return;
      }

      // 安定した日：dayRatingが「good」の日
      var stableDays = validRecords.filter(function(r) {
        return r.evening.dayRating === 'good';
      });

      if (stableDays.length < 5) {
        container.innerHTML = notEnoughData();
        return;
      }

      // 安定した日の行動パターンを集計する
      var sleep7     = stableDays.filter(function(r) { return r.morning.sleepHours >= 7; }).length;
      var outing     = stableDays.filter(function(r) { return r.evening.outing === 'した'; }).length;
      var social     = stableDays.filter(function(r) { return r.evening.socializing === 'あった'; }).length;
      var work3to4   = stableDays.filter(function(r) { return populateActivityDurationOptions(r) >= 3 && populateActivityDurationOptions(r) <= 4; }).length;

      var avgSleep   = average(stableDays.map(function(r) { return r.morning.sleepHours; }));
      var avgWork    = average(stableDays.map(function(r) { return populateActivityDurationOptions(r); }));

      var html = '<div class="mt-2">';
      html += '<div class="small text-muted mb-2">体調・メンタル・活力が安定した日（' + stableDays.length + '件）：</div>';

    // 日付文字列（例：2026-06-05）から曜日名を返す
    function getDayOfWeekLabel(dateString) {
      var d = new Date(dateString);
      var labels = ['日', '月', '火', '水', '木', '金', '土'];
      return labels[d.getDay()];
    }

    // 時刻文字列（"09:30"）を分に変換する（平均計算用）
    function timeStringToMinutes(timeString) {
      if (!timeString) return null;
      var parts = timeString.split(':');
      return Number(parts[0]) * 60 + Number(parts[1]);
    }

    // 分を時刻文字列（"09:30"）に戻す
    function minutesToTimeString(minutes) {
      var h = Math.floor(minutes / 60);
      var m = Math.round(minutes % 60);
      return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
    }

    // 候補パターンを全部試してスコア差分が大きい順に返す
    function findPatterns(validRecords, topN) {

      var toScore = dayRatingToScore;

      //console.table(validRecords.map(function(r) {return {date: r.date,dayRating: r.evening.dayRating,score: toScore(r)};}));

      //console.log('score分布:',validRecords.reduce(function(acc, r) {var s = toScore(r);acc[s] = (acc[s] || 0) + 1;return acc;}, {}));

      // --- 睡眠 ---

      var stayedInRecords = validRecords.filter(function(r) { return r.evening.outing === 'しなかった'; });
      
      [
        { group: sleepLong,  other: sleepShort, label: '睡眠7時間以上の日は', metricLabel: '調子が良い' },
        { group: sleepShort, other: sleepLong,  label: '睡眠6時間未満の日は', metricLabel: '調子が低下しやすい' },
      ].forEach(function(pattern) {

        var avg1 = average(pattern.group.map(function(r) { return toScore(r); }));
        var avg2 = average(pattern.other.map(function(r) { return toScore(r); }));
        if (avg1 === null || avg2 === null) return;
        var diff = avg1 - avg2;
        if (diff < 0.5) return;
        results.push({ label: pattern.label, metricLabel: pattern.metricLabel, diff: diff, count: pattern.group.length });
      });

      // --- 外出 ---
      var wentOut  = validRecords.filter(function(r) { return r.evening.outing === 'した'; });
      var stayedIn = validRecords.filter(function(r) { return r.evening.outing === 'しなかった'; });

      [

        if (avg1 === null || avg2 === null) return;

        results.push({ label: pattern.label, metricLabel: pattern.metricLabel, diff: diff, count: pattern.group.length });
      });

      // --- 交流 ---
      var hadSocial = validRecords.filter(function(r) { return r.evening.socializing === 'あった'; });
      var noSocial  = validRecords.filter(function(r) { return r.evening.socializing === 'なかった'; });

      [
        { group: hadSocial, other: noSocial, label: '交流があった日は', metricLabel: '調子が良い' },

        if (diff < 0.5) return;

      });

      // --- 活動時間 ---
      var work1to3 = validRecords.filter(function(r) { return r.evening.workHours > 0 && r.evening.workHours <= 3; });
      var work4to6 = validRecords.filter(function(r) { return r.evening.workHours > 3 && r.evening.workHours <= 6; });
      var work0    = validRecords.filter(function(r) { return r.evening.workHours === 0; });

      [
        { group: work4to6, other: work0, label: '活動時間4〜6時間の日は', metricLabel: '調子が良い' },
        { group: work0,    other: work4to6, label: '活動しなかった日は',   metricLabel: '調子が低下しやすい' },
      ].forEach(function(pattern) {
        if (pattern.group.length < 5 || pattern.other.length < 5) return;
        var avg1 = average(pattern.group.map(function(r) { return toScore(r); }));
        var avg2 = average(pattern.other.map(function(r) { return toScore(r); }));
        if (avg1 === null || avg2 === null) return;
        var diff = avg1 - avg2;
        if (diff < 0.5) return;
        results.push({ label: pattern.label, metricLabel: pattern.metricLabel, diff: diff, count: pattern.group.length });
      });

      // 差分が大きい順に並べてtopN件返す
      results.sort(function(a, b) { return b.diff - a.diff; });
      return results.slice(0, topN);
    }

    // パターンをHTMLで表示する
    function renderPatterns(patterns) {
      if (patterns.length === 0) {
        return '<p class="text-muted small">まだパターンが見つかりません（データが増えると表示されます）</p>';
      }

      var html = '';
      patterns.forEach(function(p, i) {
        var trendLabel      = getTrendLabel(p.diff);
        var confidenceLabel = getConfidenceLabel(p.count);
        html += '<div class="mb-2">';
        html += '<div>① '.replace('①', '①②③④⑤'.charAt(i));
        html += p.label + p.metricLabel + '傾向があります</div>';
        html += '<div class="text-muted small">';
        if (trendLabel)      html += trendLabel + '　';
        if (confidenceLabel) html += confidenceLabel + '（' + p.count + '件）';
        html += '</div>';
        html += '</div>';
      });
      return html;
    }

    // ============================
    // 最近のパターン
    // ============================

    function showRecentPatterns(records) {
      var container   = document.getElementById('recent-patterns');
      var validAll    = getValidRecords(records);
      var recent30    = getRecentRecords(validAll, 30);
      var patterns    = findPatterns(recent30, 3);
      container.innerHTML = renderPatterns(patterns);
    }

    // ============================
    // 自分の傾向
    // ============================

    function showAllPatterns(records) {
      var container = document.getElementById('all-patterns');
      var validAll  = getValidRecords(records);
      var patterns  = findPatterns(validAll, 5);
      container.innerHTML = renderPatterns(patterns);
    }

    // ============================
    // 7日間の傾向
    // ============================

    // ============================
    // 7日間の傾向：カード1枚分のHTMLを作る
    // ============================
    function weeklyCard(iconClass, label, valueText, diffText, isFull, extraClass) {
      var fullClass = isFull ? ' weekly-card-full' : '';
      var extra = extraClass ? ' ' + extraClass : '';
      var html = '<div class="weekly-card' + fullClass + extra + '">';
      html += '<div class="d-flex align-items-center gap-2">';
      html += '<div class="weekly-card-icon"><i class="bi ' + iconClass + '"></i></div>';
      html += '<span class="weekly-card-label">' + label + '</span>';
      html += '</div>';
      html += '<div class="weekly-card-value">' + valueText + '</div>';
      html += '<div class="weekly-card-diff">' + diffText + '</div>';
      html += '</div>';
      return html;
    }

    // ============================
    // 7日間の傾向：「調子」専用の目立つカード
    // ============================
    function weeklySummaryCard(iconClass, label, valueText, diffText) {
      var html = '<div class="weekly-card-summary">';
      html += '<div class="d-flex align-items-center gap-2">';
      html += '<div class="weekly-card-icon"><i class="bi ' + iconClass + '"></i></div>';
      html += '<span class="weekly-card-label">' + label + '</span>';
      html += '</div>';
      html += '<div class="weekly-card-value">' + valueText + '</div>';
      html += '<div class="weekly-card-diff">' + diffText + '</div>';
      html += '</div>';
      return html;
    }

    // ============================
    // 7日間の傾向：スコア系（体調・メンタル・活力・調子・睡眠満足度）の差分テキスト
    // ============================
    function formatScoreDiff(thisAvg, lastAvg, hasLastWeek) {
      if (!hasLastWeek || thisAvg === null || lastAvg === null) {
        return '比較データなし';
      }
      var diff = thisAvg - lastAvg;
      var rounded = Math.abs(diff).toFixed(1);
      if (diff > 0.05)  return '先週より' + rounded + '上昇';
      if (diff < -0.05) return '先週より' + rounded + '低下';
      return '変化なし';
    }

    // ============================
    // 7日間の傾向：件数系（外出日数・交流日数）の差分テキスト
    // ============================
    function formatCountDiff(thisCount, lastCount, hasLastWeek, unit) {
      if (!hasLastWeek) {
        return '比較データなし';
      }
      var diff = thisCount - lastCount;
      if (diff > 0) return '先週より' + diff + unit + '多い';
      if (diff < 0) return '先週より' + Math.abs(diff) + unit + '少ない';
      return '変化なし';
    }

    // ============================
    // 7日間の傾向：活動時間の差分テキスト（時間→分に変換して表示）
    // ============================
    function formatWorkDiff(thisAvg, lastAvg, hasLastWeek) {
      if (!hasLastWeek || thisAvg === null || lastAvg === null) {
        return '比較データなし';
      }
      var diffMinutes = Math.round((thisAvg - lastAvg) * 60);
      if (Math.abs(diffMinutes) < 5) return '変化なし';

      var absMinutes = Math.abs(diffMinutes);
      var text = absMinutes < 60 ? absMinutes + '分' : (absMinutes / 60).toFixed(1) + '時間';
      return '先週より' + text + (diffMinutes > 0 ? '増加' : '減少');
    }

    // ============================
    // 7日間の傾向：開始時刻の差分テキスト
    // ============================
    function formatStartTimeDiff(thisAvgMinutes, lastAvgMinutes, hasLastWeek) {
      if (!hasLastWeek || thisAvgMinutes === null || lastAvgMinutes === null) {
        return '比較データなし';
      }
      var diffMinutes = thisAvgMinutes - lastAvgMinutes;
      if (Math.abs(diffMinutes) < 10) return '変化なし';

      var absMinutes = Math.abs(diffMinutes);
      var hours = Math.floor(absMinutes / 60);
      var mins  = Math.round(absMinutes % 60);
      var text = (hours > 0 ? hours + '時間' : '') + (mins > 0 ? mins + '分' : '');
      return '先週より' + text + (diffMinutes < 0 ? '早い' : '遅い');
    }

    // ============================
    // scoresやmorningのデータからundefined/nullを除いて平均を取るヘルパー
    // ============================
    function averageDefined(arr) {
      var filtered = arr.filter(function(v) { return v !== undefined && v !== null; });
      return average(filtered);
    }

    function showWeeklyTrend(records) {
      var container = document.getElementById('weekly-trend');
      var validAll  = getValidRecords(records);
      var today     = getTodayString();

      // 今週（直近7日）と先週（8〜14日前）に分ける
      var thisWeek = getRecentRecords(validAll, 7);
      var lastWeekFrom = getDaysAgo(today, 14);
      var lastWeekTo   = getDaysAgo(today, 8);
      var lastWeek = validAll.filter(function(r) {
        return r.date >= lastWeekFrom && r.date <= lastWeekTo;
      });

      if (thisWeek.length === 0) {
        container.innerHTML = '<p class="text-muted">直近7日の記録がありません</p>';
        return;
      }

      var hasLastWeek = lastWeek.length > 0;

      var html = '';

      // ---- コンディション ----
      html += '<p class="weekly-group-label">コンディション</p>';

      // 「調子」は総合値なので、単独の目立つカードにする
      var thisDayRating = average(thisWeek.map(function(r) { return dayRatingToScore(r); }));
      var lastDayRating = average(lastWeek.map(function(r) { return dayRatingToScore(r); }));
      html += weeklySummaryCard('bi-emoji-neutral', '調子',
        thisDayRating.toFixed(1),
        formatScoreDiff(thisDayRating, lastDayRating, hasLastWeek));

      // 体調・メンタル・活力は「調子の内訳」として3列の小さめカードで並べる
      html += '<div class="weekly-card-grid-3">';

      var thisPhysical = averageDefined(thisWeek.map(function(r) { return r.scores ? r.scores.physical : undefined; }));
      var lastPhysical = averageDefined(lastWeek.map(function(r) { return r.scores ? r.scores.physical : undefined; }));
      html += weeklyCard('bi-heart-pulse', '体調',
        thisPhysical !== null ? thisPhysical.toFixed(1) : '-',
        formatScoreDiff(thisPhysical, lastPhysical, hasLastWeek),
        false, 'weekly-card-sub');

      var thisMental = averageDefined(thisWeek.map(function(r) { return r.scores ? r.scores.mental : undefined; }));
      var lastMental = averageDefined(lastWeek.map(function(r) { return r.scores ? r.scores.mental : undefined; }));
      html += weeklyCard('bi-cloud', 'メンタル',
        thisMental !== null ? thisMental.toFixed(1) : '-',
        formatScoreDiff(thisMental, lastMental, hasLastWeek),
        false, 'weekly-card-sub');

      var thisEnergy = averageDefined(thisWeek.map(function(r) { return r.scores ? r.scores.eveningEnergy : undefined; }));
      var lastEnergy = averageDefined(lastWeek.map(function(r) { return r.scores ? r.scores.eveningEnergy : undefined; }));
      html += weeklyCard('bi-lightning-charge', '活力',
        thisEnergy !== null ? thisEnergy.toFixed(1) : '-',
        formatScoreDiff(thisEnergy, lastEnergy, hasLastWeek),
        false, 'weekly-card-sub');

      html += '</div>';

      // ---- 生活 ----
      html += '<p class="weekly-group-label">生活</p>';
      html += '<div class="weekly-card-grid">';

      var thisSleepQuality = averageDefined(thisWeek.map(function(r) { return r.morning ? r.morning.sleepQuality : undefined; }));
      var lastSleepQuality = averageDefined(lastWeek.map(function(r) { return r.morning ? r.morning.sleepQuality : undefined; }));
      html += weeklyCard('bi-moon-stars', '睡眠満足度',
        thisSleepQuality !== null ? thisSleepQuality.toFixed(1) : '-',
        formatScoreDiff(thisSleepQuality, lastSleepQuality, hasLastWeek));

      var thisWork = average(thisWeek.map(function(r) { return populateActivityDurationOptions(r); }));
      var lastWork = average(lastWeek.map(function(r) { return populateActivityDurationOptions(r); }));
      html += weeklyCard('bi-briefcase', '活動時間',
        thisWork.toFixed(1) + '時間',
        formatWorkDiff(thisWork, lastWork, hasLastWeek));

      var thisStartList = thisWeek
        .map(function(r) { return timeStringToMinutes(r.evening.workStartTime); })
        .filter(function(m) { return m !== null; });
      var lastStartList = lastWeek
        .map(function(r) { return timeStringToMinutes(r.evening.workStartTime); })
        .filter(function(m) { return m !== null; });
      var thisStartAvg = average(thisStartList);
      var lastStartAvg = average(lastStartList);
      html += weeklyCard('bi-clock', '活動開始時刻',
        thisStartAvg !== null ? minutesToTimeString(thisStartAvg) : '-',
        formatStartTimeDiff(thisStartAvg, lastStartAvg, hasLastWeek),
        true);

      html += '</div>';

      // ---- 活動 ----
      html += '<p class="weekly-group-label">活動</p>';
      html += '<div class="weekly-card-grid">';

      var thisOuting = thisWeek.filter(function(r) { return r.evening.outing === 'した'; }).length;
      var lastOuting = lastWeek.filter(function(r) { return r.evening.outing === 'した'; }).length;
      html += weeklyCard('bi-door-open', '外出',
        thisOuting + '日',
        formatCountDiff(thisOuting, lastOuting, hasLastWeek, '日'));

      var thisSocial = thisWeek.filter(function(r) { return r.evening.socializing === 'あった'; }).length;
      var lastSocial = lastWeek.filter(function(r) { return r.evening.socializing === 'あった'; }).length;
      html += weeklyCard('bi-people', '交流',
        thisSocial + '日',
        formatCountDiff(thisSocial, lastSocial, hasLastWeek, '日'));

      html += '</div>';

      container.innerHTML = html;
    }

    // ============================
    // 実行
    // ============================

    var records = loadRecords();

    showRecentPatterns(records);
    showWeeklyTrend(records);
    showAllPatterns(records);

    var validRecords = getValidRecords(records);
    showDetailRecovery(validRecords);
    showDetailTrigger(validRecords);
    showDetailStable(validRecords);
    showDetailWeekday(validRecords);
    showDetailStartTime(validRecords);
    showDetailSleep(validRecords);
    showDetailOuting(validRecords);
    showDetailSocial(validRecords);
    showDetailWork(validRecords);
    showDetailWeather(validRecords);
    showDetailPressure(validRecords);

  </script>
