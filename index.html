<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Self Insight</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f8f9fa;
    }

    /* チェックボックス・ラジオボタンをボタン風にする */
    .sign-btn input[type="checkbox"],
    .sign-btn input[type="radio"] {
      display: none;
    }

    .sign-btn label {
      display: inline-block;
      padding: 6px 14px;
      margin: 4px;
      border: 1px solid #dee2e6;
      border-radius: 20px;
      background-color: #ffffff;
      cursor: pointer;
      font-size: 0.9rem;
      user-select: none;
    }

    .sign-btn input[type="checkbox"]:checked + label,
    .sign-btn input[type="radio"]:checked + label {
      background-color: #0d6efd;
      color: #ffffff;
      border-color: #0d6efd;
    }
  </style>
</head>
<body>

  <div class="container py-4" style="max-width: 600px; padding-bottom: 80px !important;">

    <!-- タイトル -->
    <div class="d-flex justify-content-between align-items-start mb-4">
      <div>
        <h1 class="fs-4 fw-bold mb-1">Self Insight</h1>
        <p class="text-muted mb-0">朝の記録</p>
      </div>
      <a href="evening.html" class="btn btn-outline-secondary btn-sm mt-1">夜の記録へ</a>
    </div>

    <!-- 睡眠 -->
    <div class="card mb-4">
      <div class="card-body">
        <h2 class="fs-6 fw-bold mb-3">睡眠</h2>

        <!-- 睡眠時間 -->
        <div class="mb-3">
          <div class="d-flex align-items-center gap-3 mb-2">
            <div>
              <label for="sleep-start" class="form-label mb-1">就寝</label>
              <input type="time" id="sleep-start" class="form-control" style="width: 120px;">
            </div>
            <div class="mt-3">→</div>
            <div>
              <label for="sleep-end" class="form-label mb-1">起床</label>
              <input type="time" id="sleep-end" class="form-control" style="width: 120px;">
            </div>
          </div>
          <div id="sleep-hours-display" class="text-muted small"></div>
        </div>

        <!-- 睡眠満足度 -->
        <div>
          <label class="form-label">睡眠満足度</label>
          <div class="sign-btn">
            <span><input type="radio" id="s1" name="sleep-quality" value="1"><label for="s1">1</label></span>
            <span><input type="radio" id="s2" name="sleep-quality" value="2"><label for="s2">2</label></span>
            <span><input type="radio" id="s3" name="sleep-quality" value="3"><label for="s3">3</label></span>
            <span><input type="radio" id="s4" name="sleep-quality" value="4"><label for="s4">4</label></span>
            <span><input type="radio" id="s5" name="sleep-quality" value="5"><label for="s5">5</label></span>
          </div>
          <div class="d-flex justify-content-between mt-1" style="max-width: 230px;">
            <small class="text-muted">よくない</small>
            <small class="text-muted">よい</small>
          </div>
        </div>

      </div>
    </div>

    <!-- 体調サイン -->
    <div class="card mb-3">
      <div class="card-body">
        <h2 class="fs-6 fw-bold mb-3">体調サイン <span class="text-muted fw-normal">（複数選択）</span></h2>
        <div class="sign-btn">
          <span><input type="checkbox" id="b1" name="body[]" value="問題なし"><label for="b1">問題なし</label></span>
          <span><input type="checkbox" id="b2" name="body[]" value="身体が軽い"><label for="b2">身体が軽い</label></span>
          <span><input type="checkbox" id="b3" name="body[]" value="眠い"><label for="b3">眠い</label></span>
          <span><input type="checkbox" id="b4" name="body[]" value="だるい"><label for="b4">だるい</label></span>
          <span><input type="checkbox" id="b5" name="body[]" value="強い疲労感"><label for="b5">強い疲労感</label></span>
          <span><input type="checkbox" id="b6" name="body[]" value="目の疲れ"><label for="b6">目の疲れ</label></span>
          <span><input type="checkbox" id="b7" name="body[]" value="頭痛"><label for="b7">頭痛</label></span>
          <span><input type="checkbox" id="b8" name="body[]" value="肩こり・首こり"><label for="b8">肩こり・首こり</label></span>
          <span><input type="checkbox" id="b9" name="body[]" value="食欲不振"><label for="b9">食欲不振</label></span>
          <span><input type="checkbox" id="b10" name="body[]" value="過食"><label for="b10">過食</label></span>
        </div>
      </div>
    </div>

    <!-- メンタルサイン -->
    <div class="card mb-3">
      <div class="card-body">
        <h2 class="fs-6 fw-bold mb-3">メンタルサイン <span class="text-muted fw-normal">（複数選択）</span></h2>
        <div class="sign-btn">
          <span><input type="checkbox" id="m1" name="mental[]" value="穏やか"><label for="m1">穏やか</label></span>
          <span><input type="checkbox" id="m2" name="mental[]" value="前向き"><label for="m2">前向き</label></span>
          <span><input type="checkbox" id="m3" name="mental[]" value="不安"><label for="m3">不安</label></span>
          <span><input type="checkbox" id="m4" name="mental[]" value="落ち込み"><label for="m4">落ち込み</label></span>
          <span><input type="checkbox" id="m5" name="mental[]" value="イライラ"><label for="m5">イライラ</label></span>
          <span><input type="checkbox" id="m6" name="mental[]" value="焦り"><label for="m6">焦り</label></span>
          <span><input type="checkbox" id="m7" name="mental[]" value="無気力"><label for="m7">無気力</label></span>
          <span><input type="checkbox" id="m8" name="mental[]" value="緊張"><label for="m8">緊張</label></span>
          <span><input type="checkbox" id="m9" name="mental[]" value="考えがまとまらない"><label for="m9">考えがまとまらない</label></span>
          <span><input type="checkbox" id="m10" name="mental[]" value="集中しにくい"><label for="m10">集中しにくい</label></span>
          <span><input type="checkbox" id="m11" name="mental[]" value="憂鬱"><label for="m11">憂鬱</label></span>
        </div>
      </div>
    </div>

    <!-- 活力サイン -->
    <div class="card mb-3">
      <div class="card-body">
        <h2 class="fs-6 fw-bold mb-3">活力サイン <span class="text-muted fw-normal">（1つ選択）</span></h2>
        <div class="sign-btn">
          <span><input type="radio" id="v1" name="vitality" value="いつもより動けそう"><label for="v1">いつもより動けそう</label></span>
          <span><input type="radio" id="v2" name="vitality" value="いつも通りのことはできる"><label for="v2">いつも通りのことはできる</label></span>
          <span><input type="radio" id="v3" name="vitality" value="少し頑張れば動ける"><label for="v3">少し頑張れば動ける</label></span>
          <span><input type="radio" id="v4" name="vitality" value="何もしたくない"><label for="v4">何もしたくない</label></span>
        </div>
      </div>
    </div>

    <!-- 保存ボタン -->
    <button type="button" class="btn btn-primary w-100" id="save-btn">
      朝の記録を保存する
    </button>

  </div><!-- /container -->

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // ============================
    // フォームの値を取得する関数
    // ============================

    // チェックボックス（複数選択）の選択値を配列で返す
    function getCheckedValues(name) {
      var checkboxes = document.querySelectorAll('input[name="' + name + '"]:checked');
      var values = [];
      checkboxes.forEach(function(cb) {
        values.push(cb.value);
      });
      return values;
    }

    // ラジオボタン（単一選択）の選択値を返す
    function getRadioValue(name) {
      var radio = document.querySelector('input[name="' + name + '"]:checked');
      return radio ? radio.value : null;
    }

    // ============================
    // 睡眠時間を計算する
    // ============================

    function calculateSleepHours() {

      var start = document.getElementById('sleep-start').value;
      var end   = document.getElementById('sleep-end').value;

      // どちらかが未入力の場合は0を返す
      if (!start || !end) return 0;

      // 時刻を分に変換する
      var startParts = start.split(':');
      var endParts   = end.split(':');

      var startMinutes = Number(startParts[0]) * 60 + Number(startParts[1]);
      var endMinutes   = Number(endParts[0])   * 60 + Number(endParts[1]);

      // 日をまたぐ場合（例：23:30就寝 → 07:00起床）
      if (endMinutes <= startMinutes) {
        endMinutes += 24 * 60;
      }

      var diffMinutes = endMinutes - startMinutes;

      // 分を時間に変換して小数点1桁に丸める
      return Math.round(diffMinutes / 60 * 10) / 10;
    }

    // 就寝・起床が変更されたら睡眠時間を表示する
    function updateSleepDisplay() {

      var hours = calculateSleepHours();
      var display = document.getElementById('sleep-hours-display');

      if (hours === 0) {
        display.textContent = '';
        return;
      }

      display.textContent = '睡眠時間：' + hours + '時間';
    }

    document.getElementById('sleep-start').addEventListener('change', updateSleepDisplay);
    document.getElementById('sleep-end').addEventListener('change',   updateSleepDisplay);

    // ============================
    // トースト通知を表示する
    // ============================

    function showToast(message) {
      var toast = document.getElementById('toast');
      toast.textContent = message;
      toast.style.display = 'block';

      // 2秒後に消す
      setTimeout(function() {
        toast.style.display = 'none';
      }, 2000);
    }

    // ============================
    // 今日のヒント：メッセージ設定
    // ここを書き換えるだけで文言が変わります
    // ============================
    var HINT_MESSAGES = {
      notEnoughData: '記録が増えると、あなた専用のヒントが表示されます。\n（10件以上の記録で表示されます）',
      shortSleep:    '今日は睡眠が短めです。\n予定を詰め込みすぎず、過ごしてみましょう。',
      outingEffect:  '外出した日は調子が良い傾向があります。',
      socialEffect:  '交流があった日は調子が良い傾向があります。',
      noPattern:     '引き続き記録を続けると、傾向が見えてきます。'
    };

    // ============================
    // 今日のヒントを生成する関数
    // ============================

    function generateHint(sleepHours) {

      var data = localStorage.getItem(STORAGE_KEY);
      var records = data ? JSON.parse(data) : [];

      // 朝・夜両方そろっているレコードだけ使う
      var valid = records.filter(function(r) {
        return r.morning && r.evening;
      });

      // データが10件未満の場合
      if (valid.length < 10) {
        return {
          lines: [HINT_MESSAGES.notEnoughData],
          count: valid.length
        };
      }

      // 睡眠が5時間以下の場合
      if (sleepHours > 0 && sleepHours <= 5) {
        return {
          lines: [HINT_MESSAGES.shortSleep],
          count: valid.length
        };
      }

      // 外出した日の翌日スコアを計算する
      var outingDays   = valid.filter(function(r) { return r.evening.outing === 'した'; });
      var noOutingDays = valid.filter(function(r) { return r.evening.outing === 'しなかった'; });

      var outingAvg   = outingDays.length > 0
        ? outingDays.reduce(function(sum, r) { return sum + (r.scores.eveningEnergy || 0); }, 0) / outingDays.length
        : null;
      var noOutingAvg = noOutingDays.length > 0
        ? noOutingDays.reduce(function(sum, r) { return sum + (r.scores.eveningEnergy || 0); }, 0) / noOutingDays.length
        : null;

      // 交流した日のスコアを計算する
      var socialDays   = valid.filter(function(r) { return r.evening.socializing === 'あった'; });
      var noSocialDays = valid.filter(function(r) { return r.evening.socializing === 'なかった'; });

      var socialAvg   = socialDays.length > 0
        ? socialDays.reduce(function(sum, r) { return sum + (r.scores.eveningEnergy || 0); }, 0) / socialDays.length
        : null;
      var noSocialAvg = noSocialDays.length > 0
        ? noSocialDays.reduce(function(sum, r) { return sum + (r.scores.eveningEnergy || 0); }, 0) / noSocialDays.length
        : null;

      // 表示するメッセージを集める
      var lines = [];

      if (outingAvg !== null && noOutingAvg !== null && (outingAvg - noOutingAvg) >= 0.5) {
        lines.push(HINT_MESSAGES.outingEffect);
      }

      if (socialAvg !== null && noSocialAvg !== null && (socialAvg - noSocialAvg) >= 0.5) {
        lines.push(HINT_MESSAGES.socialEffect);
      }

      if (lines.length === 0) {
        lines.push(HINT_MESSAGES.noPattern);
      }

      return {
        lines: lines,
        count: valid.length
      };
    }

    // ============================
    // 今日のヒントモーダルを表示する関数
    // ============================

    function showHintModal(sleepHours) {

      var hint = generateHint(sleepHours);

      // メッセージをHTML化する
      var messageHtml = hint.lines.map(function(line) {
        return '<p style="margin: 0 0 8px 0;">'
          + line.replace(/\n/g, '<br>')
          + '</p>';
      }).join('');

      document.getElementById('hint-message').innerHTML = messageHtml;
      document.getElementById('hint-modal').style.display = 'flex';
    }

    // モーダルを閉じる関数
    function closeHintModal() {
      document.getElementById('hint-modal').style.display = 'none';
    }

    // ============================
    // localStorage への保存・読み込み
    // ============================

    // キー名（localStorageの保存先の名前）
    var STORAGE_KEY = 'selfInsightRecords';

    // 既存の記録を全件取得する
    function loadRecords() {
      var data = localStorage.getItem(STORAGE_KEY);
      if (data === null) {
        return [];  // 初回は空の配列を返す
      }
      return JSON.parse(data);
    }

    function saveRecord(date, type, data) {
      var records = loadRecords();

      var record = records.find(function(r) {
        return r.date === date;
      });

      if (!record) {
        record = {
          date: date,
          morning: null,
          evening: null,
          scores: {},
          summary: {}
        };

        records.push(record);
      }

      record[type] = data;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    }

    // ============================
    // 天気を取得する関数
    // ============================

    // 位置情報を取得する
    function getLocation() {
      return new Promise(function(resolve, reject) {
        if (!navigator.geolocation) {
          reject('位置情報非対応');
          return;
        }
        navigator.geolocation.getCurrentPosition(
          function(position) {
            resolve({
              lat: position.coords.latitude,
              lon: position.coords.longitude
            });
          },
          function(error) {
            reject('位置情報取得失敗');
          }
        );
      });
    }

    // Open-MeteoのAPIから天気・気温を取得する
    function getWeather(lat, lon) {
      var url = 'https://api.open-meteo.com/v1/forecast'
        + '?latitude=' + lat
        + '&longitude=' + lon
        + '&current=temperature_2m,weathercode,surface_pressure'
        + '&timezone=Asia%2FTokyo';

      return fetch(url)
        .then(function(response) {
          return response.json();
        })
        .then(function(data) {
          return {
            temperature: data.current.temperature_2m,
            weatherCode: data.current.weathercode,
            pressure: data.current.surface_pressure
          };
        });
    }

    // 天気コードを日本語に変換する
    function weatherCodeToText(code) {
      if (code === 0)                return '快晴';
      if (code >= 1 && code <= 3)    return '晴れ';
      if (code >= 45 && code <= 48)  return '霧';
      if (code >= 51 && code <= 57)  return '霧雨';
      if (code >= 61 && code <= 67)  return '雨';
      if (code >= 71 && code <= 77)  return '雪';
      if (code >= 80 && code <= 82)  return 'にわか雨';
      if (code >= 85 && code <= 86)  return 'にわか雪';
      if (code >= 95 && code <= 99)  return '雷雨';
      return '不明';
    }

    // ============================
    // 保存ボタンの処理
    // ============================
    document.getElementById('save-btn').addEventListener('click', function() {

      // ボタンを無効化（天気取得中）
      var btn = document.getElementById('save-btn');
      btn.disabled = true;
      btn.textContent = '取得中...';

      // ローカル時間（日本時間）で日付を取得する
      var now = new Date();
      var today = now.getFullYear() + '-'
        + String(now.getMonth() + 1).padStart(2, '0') + '-'
        + String(now.getDate()).padStart(2, '0');

      var record = {
        date: today,
        time: new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }),
        type: 'morning',
        body: getCheckedValues('body[]'),
        mental: getCheckedValues('mental[]'),
        vitality: getRadioValue('vitality'),
        sleepHours: calculateSleepHours(),
        sleepStart: document.getElementById('sleep-start').value,
        sleepEnd:   document.getElementById('sleep-end').value,
        sleepQuality: Number(getRadioValue('sleep-quality')),
        weather: null,
        temperature: null,
        pressure: null
      };

      // 2. 位置情報→天気を取得してから保存する
      getLocation()
        .then(function(location) {
          return getWeather(location.lat, location.lon);
        })
        .then(function(weather) {
          record.weather = weatherCodeToText(weather.weatherCode);
          record.temperature = weather.temperature;
          record.pressure = weather.pressure;
        })
        .catch(function(error) {
          // 天気取得失敗でも記録は続行する
          console.log('天気取得スキップ:', error);
        })
        .finally(function() {
          // 3. localStorageに保存
          saveRecord(
            record.date,
            'morning',
            {
              body: record.body,
              mental: record.mental,
              vitality: record.vitality,
              sleepHours: record.sleepHours,
              sleepStart: record.sleepStart,
              sleepEnd:   record.sleepEnd,
              sleepQuality: record.sleepQuality,
              weather: record.weather,
              temperature: record.temperature,
              pressure: record.pressure
            }
          );

          // 4. コンソールに出力（デバッグ用）
          console.log('保存しました:', record);

          // 5. 成功メッセージを表示
          showToast('記録しました！（' + record.date + ' ' + record.time + '）');

          // 6. ボタンを元に戻す
          btn.disabled = false;
          btn.textContent = '朝の記録を保存する';

          showHintModal(record.sleepHours);

          // 7. 3秒後にメッセージを消す
          setTimeout(function() {
            messageDiv.style.display = 'none';
          }, 3000);
        });
    });
  </script>

  <!-- 今日のヒント モーダル -->
  <div id="hint-modal" style="
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: rgba(0,0,0,0.4);
    z-index: 300;
    align-items: center;
    justify-content: center;
    padding: 20px;
  " onclick="closeHintModal()">

    <div style="
      background: #ffffff;
      border-radius: 12px;
      padding: 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    " onclick="event.stopPropagation()">

      <div style="font-size: 1.1rem; font-weight: bold; margin-bottom: 16px;">
        💡 今日のヒント
      </div>

      <div id="hint-message" style="
        font-size: 0.95rem;
        line-height: 1.6;
        color: #333;
      "></div>

      <button onclick="closeHintModal()" style="
        margin-top: 16px;
        width: 100%;
        padding: 10px;
        background-color: #0d6efd;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 0.95rem;
        cursor: pointer;
      ">閉じる</button>

    </div>
  </div>
  
  <!-- トースト通知 -->
  <div id="toast" style="
    display: none;
    position: fixed;
    top: 20px;
    right: 20px;
    background-color: #198754;
    color: #ffffff;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 0.9rem;
    z-index: 200;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  ">記録しました</div>

  <!-- 下部固定ナビ -->
  <nav style="
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background-color: #ffffff;
    border-top: 1px solid #dee2e6;
    display: flex;
    z-index: 100;
  ">
    <a href="index.html" style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:10px 0; text-decoration:none; color:#6c757d; font-size:0.75rem;">
      <span style="font-size:1.2rem; margin-bottom:2px;">✏️</span>
      記録
    </a>
    <a href="records.html" style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:10px 0; text-decoration:none; color:#6c757d; font-size:0.75rem;">
      <span style="font-size:1.2rem; margin-bottom:2px;">📅</span>
      記録一覧
    </a>
    <a href="analysis.html" style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:10px 0; text-decoration:none; color:#6c757d; font-size:0.75rem;">
      <span style="font-size:1.2rem; margin-bottom:2px;">📊</span>
      分析
    </a>
  </nav>

</body>
