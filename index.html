<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Self Insight</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f8f9fa;
    }

    /* チェックボックス・ラジオボタンをボタン風にする */
    .sign-btn input[type="checkbox"],
    .sign-btn input[type="radio"] {
      display: none;
    }

    .sign-btn label {
      display: inline-block;
      padding: 6px 14px;
      margin: 4px;
      border: 1px solid #dee2e6;
      border-radius: 20px;
      background-color: #ffffff;
      cursor: pointer;
      font-size: 0.9rem;
      user-select: none;
    }

    .sign-btn input[type="checkbox"]:checked + label,
    .sign-btn input[type="radio"]:checked + label {
      background-color: #0d6efd;
      color: #ffffff;
      border-color: #0d6efd;
    }
  </style>
</head>
<body>

  <div class="container py-4" style="max-width: 600px;">

    <!-- タイトル -->
    <h1 class="fs-4 fw-bold mb-1">Self Insight</h1>
    <p class="text-muted mb-4">朝の記録</p>

    <!-- 体調サイン -->
    <div class="card mb-3">
      <div class="card-body">
        <h2 class="fs-6 fw-bold mb-3">体調サイン <span class="text-muted fw-normal">（複数選択）</span></h2>
        <div class="sign-btn">
          <span><input type="checkbox" id="b1" name="body[]" value="元気"><label for="b1">元気</label></span>
          <span><input type="checkbox" id="b2" name="body[]" value="少しだるい"><label for="b2">少しだるい</label></span>
          <span><input type="checkbox" id="b3" name="body[]" value="強くだるい"><label for="b3">強くだるい</label></span>
          <span><input type="checkbox" id="b4" name="body[]" value="眠い"><label for="b4">眠い</label></span>
          <span><input type="checkbox" id="b5" name="body[]" value="頭痛"><label for="b5">頭痛</label></span>
          <span><input type="checkbox" id="b6" name="body[]" value="胃腸不調"><label for="b6">胃腸不調</label></span>
          <span><input type="checkbox" id="b7" name="body[]" value="肩こり"><label for="b7">肩こり</label></span>
        </div>
      </div>
    </div>

    <!-- メンタルサイン -->
    <div class="card mb-3">
      <div class="card-body">
        <h2 class="fs-6 fw-bold mb-3">メンタルサイン <span class="text-muted fw-normal">（複数選択）</span></h2>
        <div class="sign-btn">
          <span><input type="checkbox" id="m1" name="mental[]" value="穏やか"><label for="m1">穏やか</label></span>
          <span><input type="checkbox" id="m2" name="mental[]" value="前向き"><label for="m2">前向き</label></span>
          <span><input type="checkbox" id="m3" name="mental[]" value="不安"><label for="m3">不安</label></span>
          <span><input type="checkbox" id="m4" name="mental[]" value="落ち込み"><label for="m4">落ち込み</label></span>
          <span><input type="checkbox" id="m5" name="mental[]" value="イライラ"><label for="m5">イライラ</label></span>
          <span><input type="checkbox" id="m6" name="mental[]" value="焦り"><label for="m6">焦り</label></span>
          <span><input type="checkbox" id="m7" name="mental[]" value="無気力"><label for="m7">無気力</label></span>
          <span><input type="checkbox" id="m8" name="mental[]" value="緊張"><label for="m8">緊張</label></span>
        </div>
      </div>
    </div>

    <!-- 活力サイン -->
    <div class="card mb-3">
      <div class="card-body">
        <h2 class="fs-6 fw-bold mb-3">活力サイン <span class="text-muted fw-normal">（1つ選択）</span></h2>
        <div class="sign-btn">
          <span><input type="radio" id="v1" name="vitality" value="やる気十分"><label for="v1">やる気十分</label></span>
          <span><input type="radio" id="v2" name="vitality" value="普通"><label for="v2">普通</label></span>
          <span><input type="radio" id="v3" name="vitality" value="取りかかりが重い"><label for="v3">取りかかりが重い</label></span>
          <span><input type="radio" id="v4" name="vitality" value="何もしたくない"><label for="v4">何もしたくない</label></span>
        </div>
      </div>
    </div>

    <!-- 睡眠 -->
    <div class="card mb-4">
      <div class="card-body">
        <h2 class="fs-6 fw-bold mb-3">睡眠</h2>

        <!-- 睡眠時間 -->
        <div class="mb-3">
          <label for="sleep-hours" class="form-label">睡眠時間</label>
          <div class="d-flex align-items-center gap-2">
            <input type="number" id="sleep-hours" class="form-control" style="width: 80px;"
              min="0" max="24" step="0.5" placeholder="7">
            <span class="text-muted">時間</span>
          </div>
        </div>

        <!-- 睡眠満足度 -->
        <div>
          <label class="form-label">睡眠満足度</label>
          <div class="sign-btn">
            <span><input type="radio" id="s1" name="sleep-quality" value="1"><label for="s1">1</label></span>
            <span><input type="radio" id="s2" name="sleep-quality" value="2"><label for="s2">2</label></span>
            <span><input type="radio" id="s3" name="sleep-quality" value="3"><label for="s3">3</label></span>
            <span><input type="radio" id="s4" name="sleep-quality" value="4"><label for="s4">4</label></span>
            <span><input type="radio" id="s5" name="sleep-quality" value="5"><label for="s5">5</label></span>
          </div>
          <div class="d-flex justify-content-between mt-1" style="max-width: 200px;">
            <small class="text-muted">よくない</small>
            <small class="text-muted">よい</small>
          </div>
        </div>

      </div>
    </div>

    <!-- 保存ボタン -->
    <button type="button" class="btn btn-primary w-100" id="save-btn">
      朝の記録を保存する
    </button>

    <!-- 記録一覧へのリンク -->
    <div class="d-flex justify-content-between mt-3">
      <a href="evening.html" class="text-muted small">夜の記録へ →</a>
      <a href="analysis.html" class="text-muted small">分析を見る →</a>
      <a href="records.html" class="text-muted small">記録一覧を見る →</a>
    </div>

    <!-- 保存結果メッセージ -->
    <div id="save-message" class="mt-3" style="display: none;"></div>

  </div><!-- /container -->

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // ============================
    // フォームの値を取得する関数
    // ============================

    // チェックボックス（複数選択）の選択値を配列で返す
    function getCheckedValues(name) {
      var checkboxes = document.querySelectorAll('input[name="' + name + '"]:checked');
      var values = [];
      checkboxes.forEach(function(cb) {
        values.push(cb.value);
      });
      return values;
    }

    // ラジオボタン（単一選択）の選択値を返す
    function getRadioValue(name) {
      var radio = document.querySelector('input[name="' + name + '"]:checked');
      return radio ? radio.value : null;
    }

    // ============================
    // localStorage への保存・読み込み
    // ============================

    // キー名（localStorageの保存先の名前）
    var STORAGE_KEY = 'selfInsightRecords';

    // 既存の記録を全件取得する
    function loadRecords() {
      var data = localStorage.getItem(STORAGE_KEY);
      if (data === null) {
        return [];  // 初回は空の配列を返す
      }
      return JSON.parse(data);
    }

    // 記録を1件追加して保存する
    function saveRecord(newRecord) {
      var records = loadRecords();   // 既存データを取得
      records.push(newRecord);       // 新しいデータを追加
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));  // 上書き保存
    }

    // ============================
    // 天気を取得する関数
    // ============================

    // 位置情報を取得する
    function getLocation() {
      return new Promise(function(resolve, reject) {
        if (!navigator.geolocation) {
          reject('位置情報非対応');
          return;
        }
        navigator.geolocation.getCurrentPosition(
          function(position) {
            resolve({
              lat: position.coords.latitude,
              lon: position.coords.longitude
            });
          },
          function(error) {
            reject('位置情報取得失敗');
          }
        );
      });
    }

    // Open-MeteoのAPIから天気・気温を取得する
    function getWeather(lat, lon) {
      var url = 'https://api.open-meteo.com/v1/forecast'
        + '?latitude=' + lat
        + '&longitude=' + lon
        + '&current=temperature_2m,weathercode'
        + '&timezone=Asia%2FTokyo';

      return fetch(url)
        .then(function(response) {
          return response.json();
        })
        .then(function(data) {
          return {
            temperature: data.current.temperature_2m,
            weatherCode: data.current.weathercode
          };
        });
    }

    // 天気コードを日本語に変換する
    function weatherCodeToText(code) {
      if (code === 0)                return '快晴';
      if (code >= 1 && code <= 3)    return '晴れ';
      if (code >= 45 && code <= 48)  return '霧';
      if (code >= 51 && code <= 57)  return '霧雨';
      if (code >= 61 && code <= 67)  return '雨';
      if (code >= 71 && code <= 77)  return '雪';
      if (code >= 80 && code <= 82)  return 'にわか雨';
      if (code >= 85 && code <= 86)  return 'にわか雪';
      if (code >= 95 && code <= 99)  return '雷雨';
      return '不明';
    }

    // ============================
    // 保存ボタンの処理
    // ============================
    document.getElementById('save-btn').addEventListener('click', function() {

      // ボタンを無効化（天気取得中）
      var btn = document.getElementById('save-btn');
      btn.disabled = true;
      btn.textContent = '取得中...';

      // 1. フォームの値を集める
      var record = {
        date: new Date().toLocaleDateString('ja-JP'),
        time: new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }),
        type: 'morning',
        body: getCheckedValues('body[]'),
        mental: getCheckedValues('mental[]'),
        vitality: getRadioValue('vitality'),
        sleepHours: document.getElementById('sleep-hours').value,
        sleepQuality: getRadioValue('sleep-quality'),
        weather: null,
        temperature: null
      };

      // 2. 位置情報→天気を取得してから保存する
      getLocation()
        .then(function(location) {
          return getWeather(location.lat, location.lon);
        })
        .then(function(weather) {
          record.weather = weatherCodeToText(weather.weatherCode);
          record.temperature = weather.temperature;
        })
        .catch(function(error) {
          // 天気取得失敗でも記録は続行する
          console.log('天気取得スキップ:', error);
        })
        .finally(function() {
          // 3. localStorageに保存
          saveRecord(record);

          // 4. コンソールに出力（デバッグ用）
          console.log('保存しました:', record);

          // 5. 成功メッセージを表示
          var messageDiv = document.getElementById('save-message');
          messageDiv.innerHTML = '<div class="alert alert-success">記録しました！（' + record.date + ' ' + record.time + '）</div>';
          messageDiv.style.display = 'block';

          // 6. ボタンを元に戻す
          btn.disabled = false;
          btn.textContent = '朝の記録を保存する';

          // 7. 3秒後にメッセージを消す
          setTimeout(function() {
            messageDiv.style.display = 'none';
          }, 3000);
        });
    });
  </script>
</body>
</html>
