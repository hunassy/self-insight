<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>データ管理 - Self Insight</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { 
      font-family: 'Noto Sans JP', sans-serif;
      background-color: #f8f9fa; 
    }
    .record-card { 
      border-left: 4px solid #0d6efd; 
    }
  </style>
</head>
<body>

  <div class="container py-4" style="max-width: 600px; padding-bottom: 80px !important;">

    <h1 class="fs-4 fw-bold mb-1">データ管理</h1>
    <p class="text-muted mb-4">記録の日付を修正できます</p>

    <!-- 注意書き -->
    <div class="alert alert-warning mb-4">
      ⚠️ この画面は日付修正用の一時的な画面です。<br>
      操作は慎重に行ってください。
    </div>

    <!-- エクスポート -->
    <div class="card mb-4">
      <div class="card-body">
        <h2 class="fs-6 fw-bold mb-2">データのエクスポート</h2>
        <p class="text-muted small mb-3">記録をJSONファイルとして保存します。バックアップや機種変更のときに使ってください。</p>
        <button class="btn btn-outline-primary" onclick="exportData()">
          JSONファイルをダウンロードする
        </button>
      </div>
    </div>

    <!-- インポート -->
    <div class="card mb-4">
      <div class="card-body">
        <h2 class="fs-6 fw-bold mb-2">データのインポート</h2>
        <p class="text-muted small mb-2">保存したJSONファイルを読み込みます。</p>
        <p class="text-danger small mb-3">⚠️ 現在の記録はすべて上書きされます。必ず事前にエクスポートしてください。</p>
        <input type="file" id="import-file" accept=".json" class="form-control mb-2" style="max-width: 300px;">
        <button class="btn btn-outline-danger" onclick="importData()">
          読み込んで上書きする
        </button>
      </div>
    </div>

    <!-- 記録一覧 -->
    <div id="records-container"></div>

    <!-- 結果メッセージ -->
    <div id="message" class="mt-3" style="display:none;"></div>

    <div class="mt-4">
      <a href="records.html" class="text-muted small">← 記録一覧に戻る</a>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>

    var STORAGE_KEY = 'selfInsightRecords';

    // ============================
    // エクスポート（JSONファイルとして保存する）
    // ============================

    function exportData() {

      var records = loadRecords();

      if (records.length === 0) {
        alert('エクスポートできる記録がありません');
        return;
      }

      // JSONを文字列に変換する
      var json = JSON.stringify(records, null, 2);

      // ダウンロード用のリンクを作ってクリックする
      var blob = new Blob([json], { type: 'application/json' });
      var url = URL.createObjectURL(blob);

      var today = new Date().toISOString().split('T')[0];
      var filename = 'self-insight-backup-' + today + '.json';

      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();

      URL.revokeObjectURL(url);

      showMessage('エクスポートしました：' + filename, 'success');
    }

    // ============================
    // インポート（JSONファイルを読み込む）
    // ============================

    function importData() {

      var fileInput = document.getElementById('import-file');
      var file = fileInput.files[0];

      // ファイルが選択されているか確認する
      if (!file) {
        alert('JSONファイルを選択してください');
        return;
      }

      // ファイルの拡張子を確認する
      if (!file.name.endsWith('.json')) {
        alert('JSONファイルを選択してください（.json）');
        return;
      }

      // 確認ダイアログを出す
      var ok = confirm(
        '現在の記録をすべて上書きします。\n' +
        'この操作は元に戻せません。\n\n' +
        '続けますか？'
      );
      if (!ok) return;

      // ファイルを読み込む
      var reader = new FileReader();

      reader.onload = function(e) {

        var parsed;

        // JSONとして読み込めるか確認する
        try {
          parsed = JSON.parse(e.target.result);
        } catch (error) {
          alert('ファイルの形式が正しくありません。\nSelf Insightのバックアップファイルを選択してください。');
          return;
        }

        // 配列かどうか確認する（最低限のチェック）
        if (!Array.isArray(parsed)) {
          alert('ファイルの形式が正しくありません。\nSelf Insightのバックアップファイルを選択してください。');
          return;
        }

        // localStorageに書き込む
        localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));

        showMessage('インポートしました（' + parsed.length + '件）', 'success');

        // ファイル選択をリセットする
        fileInput.value = '';

        // 画面を再描画する
        render();
      };

      reader.readAsText(file);
    }

    // ============================
    // データの読み込み・保存
    // ============================

    function loadRecords() {
      var data = localStorage.getItem(STORAGE_KEY);
      if (data === null) return [];
      return JSON.parse(data);
    }

    function saveAllRecords(records) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    }

    // ============================
    // 記録の状態を文字で表示する
    // ============================

    function getStatusText(record) {
      var parts = [];
      if (record.morning) parts.push('朝あり');
      if (record.evening) parts.push('夜あり');
      if (parts.length === 0) return '記録なし';
      return parts.join('・');
    }

    // ============================
    // 画面を描画する
    // ============================

    function render() {

      var records = loadRecords();
      var container = document.getElementById('records-container');

      if (records.length === 0) {
        container.innerHTML = '<p class="text-muted">記録がありません</p>';
        return;
      }

      // 日付の新しい順に並べる
      var sorted = records.slice().sort(function(a, b) {
        return a.date > b.date ? -1 : 1;
      });

      var html = '';

      sorted.forEach(function(record) {

        html += `
          <div class="card mb-3 record-card">
            <div class="card-body">

              <!-- 現在の日付と状態 -->
              <div class="mb-2">
                <span class="fw-bold">${record.date}</span>
                <span class="text-muted small ms-2">${getStatusText(record)}</span>
              </div>

              <!-- 日付変更フォーム -->
              <div class="d-flex align-items-center gap-2">
                <input
                  type="date"
                  class="form-control form-control-sm"
                  style="width: 160px;"
                  id="new-date-${record.date}"
                  value="${record.date}"
                >
                <button
                  class="btn btn-sm btn-outline-primary"
                  onclick="changeDate('${record.date}')"
                >
                  日付を変更する
                </button>
              </div>

              <!-- 削除ボタン -->
              <div class="mt-2">
                <button
                  class="btn btn-sm btn-outline-danger"
                  onclick="deleteRecord('${record.date}')"
                >
                  この記録を削除する
                </button>
              </div>

            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    // ============================
    // 日付を変更する
    // ============================

    function changeDate(oldDate) {

      // 新しい日付を取得する
      var input = document.getElementById('new-date-' + oldDate);
      var newDate = input.value;

      // 入力チェック
      if (!newDate) {
        showMessage('日付を入力してください', 'danger');
        return;
      }

      if (newDate === oldDate) {
        showMessage('同じ日付です。変更する場合は別の日付を選んでください', 'warning');
        return;
      }

      // 確認
      var ok = confirm(oldDate + ' の記録を ' + newDate + ' に移動しますか？');
      if (!ok) return;

      var records = loadRecords();

      // 移動先の日付にすでに記録があるか確認する
      var existingRecord = records.find(function(r) { return r.date === newDate; });
      if (existingRecord) {
        showMessage(newDate + ' にはすでに記録があります。先にその記録を削除してから移動してください', 'danger');
        return;
      }

      // 対象の記録を見つけて日付を変更する
      var target = records.find(function(r) { return r.date === oldDate; });
      if (!target) {
        showMessage('記録が見つかりませんでした', 'danger');
        return;
      }

      target.date = newDate;

      // 保存する
      saveAllRecords(records);

      showMessage(oldDate + ' の記録を ' + newDate + ' に移動しました', 'success');

      // 画面を再描画する
      render();
    }

    // ============================
    // 記録を削除する
    // ============================

    function deleteRecord(date) {

      var ok = confirm(date + ' の記録を削除しますか？\nこの操作は元に戻せません。');
      if (!ok) return;

      var records = loadRecords();

      // 対象の記録を除いた配列を作る
      var newRecords = records.filter(function(r) { return r.date !== date; });

      saveAllRecords(newRecords);

      showMessage(date + ' の記録を削除しました', 'success');

      render();
    }

    // ============================
    // メッセージを表示する
    // ============================

    function showMessage(text, type) {
      var div = document.getElementById('message');
      div.innerHTML = '<div class="alert alert-' + type + '">' + text + '</div>';
      div.style.display = 'block';

      // 5秒後に消す
      setTimeout(function() {
        div.style.display = 'none';
      }, 5000);
    }

    // ============================
    // 起動時に描画する
    // ============================

    render();

  </script>

  <!-- 下部固定ナビ -->
  <nav style="
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background-color: #ffffff;
    border-top: 1px solid #dee2e6;
    display: flex;
    z-index: 100;
  ">
    <a href="index.html" style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:10px 0; text-decoration:none; color:#6c757d; font-size:0.75rem;">
      <i class="bi bi-pencil-square" style="font-size:1.2rem; margin-bottom:2px;"></i>
      記録
    </a>
    <a href="records.html" style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:10px 0; text-decoration:none; color:#6c757d; font-size:0.75rem;">
      <i class="bi bi-calendar3" style="font-size:1.2rem; margin-bottom:2px;"></i>
      記録一覧
    </a>
    <a href="analysis.html" style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:10px 0; text-decoration:none; color:#6c757d; font-size:0.75rem;">
      <i class="bi bi-bar-chart-line" style="font-size:1.2rem; margin-bottom:2px;"></i>
      分析
    </a>
  </nav>

</body>
</html>
