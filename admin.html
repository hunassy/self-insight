<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>データ管理 - Self Insight</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .record-card { border-left: 4px solid #0d6efd; }
  </style>
</head>
<body>

  <div class="container py-4" style="max-width: 600px;">

    <h1 class="fs-4 fw-bold mb-1">データ管理</h1>
    <p class="text-muted mb-4">記録の日付を修正できます</p>

    <!-- 注意書き -->
    <div class="alert alert-warning mb-4">
      ⚠️ この画面は日付修正用の一時的な画面です。<br>
      操作は慎重に行ってください。
    </div>

    <!-- 記録一覧 -->
    <div id="records-container"></div>

    <!-- 結果メッセージ -->
    <div id="message" class="mt-3" style="display:none;"></div>

    <div class="mt-4">
      <a href="records.html" class="text-muted small">← 記録一覧に戻る</a>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>

    var STORAGE_KEY = 'selfInsightRecords';

    // ============================
    // データの読み込み・保存
    // ============================

    function loadRecords() {
      var data = localStorage.getItem(STORAGE_KEY);
      if (data === null) return [];
      return JSON.parse(data);
    }

    function saveAllRecords(records) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    }

    // ============================
    // 記録の状態を文字で表示する
    // ============================

    function getStatusText(record) {
      var parts = [];
      if (record.morning) parts.push('朝あり');
      if (record.evening) parts.push('夜あり');
      if (parts.length === 0) return '記録なし';
      return parts.join('・');
    }

    // ============================
    // 画面を描画する
    // ============================

    function render() {

      var records = loadRecords();
      var container = document.getElementById('records-container');

      if (records.length === 0) {
        container.innerHTML = '<p class="text-muted">記録がありません</p>';
        return;
      }

      // 日付の新しい順に並べる
      var sorted = records.slice().sort(function(a, b) {
        return a.date > b.date ? -1 : 1;
      });

      var html = '';

      sorted.forEach(function(record) {

        html += `
          <div class="card mb-3 record-card">
            <div class="card-body">

              <!-- 現在の日付と状態 -->
              <div class="mb-2">
                <span class="fw-bold">${record.date}</span>
                <span class="text-muted small ms-2">${getStatusText(record)}</span>
              </div>

              <!-- 日付変更フォーム -->
              <div class="d-flex align-items-center gap-2">
                <input
                  type="date"
                  class="form-control form-control-sm"
                  style="width: 160px;"
                  id="new-date-${record.date}"
                  value="${record.date}"
                >
                <button
                  class="btn btn-sm btn-outline-primary"
                  onclick="changeDate('${record.date}')"
                >
                  日付を変更する
                </button>
              </div>

              <!-- 削除ボタン -->
              <div class="mt-2">
                <button
                  class="btn btn-sm btn-outline-danger"
                  onclick="deleteRecord('${record.date}')"
                >
                  この記録を削除する
                </button>
              </div>

            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    // ============================
    // 日付を変更する
    // ============================

    function changeDate(oldDate) {

      // 新しい日付を取得する
      var input = document.getElementById('new-date-' + oldDate);
      var newDate = input.value;

      // 入力チェック
      if (!newDate) {
        showMessage('日付を入力してください', 'danger');
        return;
      }

      if (newDate === oldDate) {
        showMessage('同じ日付です。変更する場合は別の日付を選んでください', 'warning');
        return;
      }

      // 確認
      var ok = confirm(oldDate + ' の記録を ' + newDate + ' に移動しますか？');
      if (!ok) return;

      var records = loadRecords();

      // 移動先の日付にすでに記録があるか確認する
      var existingRecord = records.find(function(r) { return r.date === newDate; });
      if (existingRecord) {
        showMessage(newDate + ' にはすでに記録があります。先にその記録を削除してから移動してください', 'danger');
        return;
      }

      // 対象の記録を見つけて日付を変更する
      var target = records.find(function(r) { return r.date === oldDate; });
      if (!target) {
        showMessage('記録が見つかりませんでした', 'danger');
        return;
      }

      target.date = newDate;

      // 保存する
      saveAllRecords(records);

      showMessage(oldDate + ' の記録を ' + newDate + ' に移動しました', 'success');

      // 画面を再描画する
      render();
    }

    // ============================
    // 記録を削除する
    // ============================

    function deleteRecord(date) {

      var ok = confirm(date + ' の記録を削除しますか？\nこの操作は元に戻せません。');
      if (!ok) return;

      var records = loadRecords();

      // 対象の記録を除いた配列を作る
      var newRecords = records.filter(function(r) { return r.date !== date; });

      saveAllRecords(newRecords);

      showMessage(date + ' の記録を削除しました', 'success');

      render();
    }

    // ============================
    // メッセージを表示する
    // ============================

    function showMessage(text, type) {
      var div = document.getElementById('message');
      div.innerHTML = '<div class="alert alert-' + type + '">' + text + '</div>';
      div.style.display = 'block';

      // 5秒後に消す
      setTimeout(function() {
        div.style.display = 'none';
      }, 5000);
    }

    // ============================
    // 起動時に描画する
    // ============================

    render();

  </script>

</body>
</html>
