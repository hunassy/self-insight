  <style>
    /* ============================
       カラー設定
       色を変えたいときはここだけ修正する
    ============================ */
    :root {
      --color-primary:    #6B4F5E;
      --color-primary-hover: #8B6675;
      --color-bg:         #F7F4F5;
      --color-selected-text: #ffffff;
    }

    body {
      background-color: var(--color-bg);
      font-family: 'Noto Sans JP', sans-serif;
    }

    /* チェックボックス・ラジオボタンをボタン風にする */
    .sign-btn input[type="checkbox"],
    .sign-btn input[type="radio"] {
      display: none;
    }

    /* ボタンを横に並べるとき上端を揃える */
    .sign-btn {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
    }

    /* 元の横長ボタン */
    .sign-btn label {
      display: inline-block;
      padding: 6px 14px;
      margin: 4px;
      border: 1px solid #dee2e6;
      border-radius: 20px;
      background-color: #ffffff;
      cursor: pointer;
      font-size: 0.9rem;
      user-select: none;
    }

    /* アイコン付き正方形ボタン */
    .sign-btn-icon {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
    }

    .sign-btn-icon label {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-top: 10px;
      padding-bottom: 8px;
      width: 72px;
      height: 72px;
      margin: 4px;
      border: 1px solid #dee2e6;
      border-radius: 12px;
      background-color: #ffffff;
      cursor: pointer;
      user-select: none;
      gap: 0;
      color: #555;
      text-align: center;
      line-height: 1.2;
    }

    /* アイコン（絵文字）部分 */
    /* アイコン部分：高さを固定して揃える */
    .sign-btn-icon label .icon {
      font-size: 1.6rem;
      line-height: 1;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* テキスト：通常 */
    .sign-btn-icon label .text {
      font-size: 0.68rem;
    }

    /* テキスト：長いもの用（少し小さく） */
    .sign-btn-icon label .text-sm {
      font-size: 0.58rem;
      line-height: 1.3;
    }

    .sign-btn input[type="checkbox"]:checked + label,
    .sign-btn input[type="radio"]:checked + label {
      background-color: var(--color-primary);
      color: var(--color-selected-text);
      border-color: var(--color-primary);
    }

    /* sign-btn-iconのチェックボックス・ラジオボタンを非表示にする */
    .sign-btn-icon input[type="checkbox"],
    .sign-btn-icon input[type="radio"] {
      display: none;
    }

    /* 選択時の色 */
    .sign-btn-icon input[type="checkbox"]:checked + label,
    .sign-btn-icon input[type="radio"]:checked + label {
      background-color: var(--color-primary);
      color: var(--color-selected-text);
      border-color: var(--color-primary);
    }

    /* 選択時のアイコン色 */
    .sign-btn-icon input[type="checkbox"]:checked + label i,
    .sign-btn-icon input[type="radio"]:checked + label i {
      color: #ffffff;
    }

    /* 保存ボタン */
    .btn-primary {
      background-color: var(--color-primary) !important;
      border-color: var(--color-primary) !important;
    }

    .btn-primary:hover {
      background-color: var(--color-primary-hover) !important;
      border-color: var(--color-primary-hover) !important;
    }
  </style>

  <script>
    // ============================
    // フォームの値を取得する関数
    // ============================

    function getCheckedValues(name) {
      var checkboxes = document.querySelectorAll('input[name="' + name + '"]:checked');
      var values = [];
      checkboxes.forEach(function(cb) {
        values.push(cb.value);
      });
      return values;
    }

    function getRadioValue(name) {
      var radio = document.querySelector('input[name="' + name + '"]:checked');
      return radio ? radio.value : null;
    }

    // ============================
    // 開始時刻・作業時間のプルダウンを作る
    // ============================

    // 開始時刻（06:00〜23:30、30分刻み）
    function populateWorkStartTimeOptions() {
      var select = document.getElementById('work-start-time');
      var hour = 6;
      var minute = 0;
      while (hour < 24) {
        var h = String(hour).padStart(2, '0');
        var m = String(minute).padStart(2, '0');
        var option = document.createElement('option');
        option.value = h + ':' + m;
        option.textContent = h + ':' + m;
        select.appendChild(option);

        minute += 30;
        if (minute === 60) {
          minute = 0;
          hour++;
        }
      }
    }

    // 作業時間（0〜12時間、0.5時間刻み）
    function populateWorkDurationOptions() {
      var select = document.getElementById('work-duration');
      for (var i = 0; i <= 24; i++) {
        var hours = i * 0.5;
        var option = document.createElement('option');
        option.value = hours;
        option.textContent = hours + '時間';
        select.appendChild(option);
      }
    }

    populateWorkStartTimeOptions();
    populateWorkDurationOptions();

    // ============================
    // スコア計算の関数
    // ============================

    // 朝の活力をスコアに変換する
    function morningEnergyToScore(vitality) {
      if (vitality === 'いつもより動けそう')      return 2;
      if (vitality === 'いつも通りのことはできる') return 1;
      if (vitality === '少し頑張れば動ける')       return -1;
      if (vitality === '何もしたくない')           return -2;
      return null;
    }

    // 夜の活力をスコアに変換する
    function eveningEnergyToScore(vitality) {
      if (vitality === '想定以上に動けた')     return 2;
      if (vitality === '普段通りに動けた')     return 1;
      if (vitality === '最低限は動けた')       return -1;
      if (vitality === 'ほとんど動けなかった') return -2;
      return null;
    }

    // メンタルサインをスコアに変換する（配列を受け取って合計を返す）
    function mentalSignsToScore(signs) {
      var GOOD  = ['穏やか', '前向き'];
      var BAD   = ['不安', '焦り', '落ち込み', '憂鬱', '無気力', 'イライラ', '緊張', '集中しにくい', '考えがまとまらない'];
      var score = 0;
      signs.forEach(function(sign) {
        if (GOOD.indexOf(sign) !== -1) score += 1;
        if (BAD.indexOf(sign)  !== -1) score -= 1;
      });
      return score;
    }

    // 体調サインをスコアに変換する（配列を受け取って合計を返す）
    function physicalSignsToScore(signs) {
      var GOOD = ['問題なし', '身体が軽い'];
      var BAD  = ['眠い', 'だるい', '強い疲労感', '目の疲れ', '頭痛', '肩こり・首こり', '食欲不振', '過食'];
      var score = 0;
      signs.forEach(function(sign) {
        if (GOOD.indexOf(sign) !== -1) score += 1;
        if (BAD.indexOf(sign)  !== -1) score -= 1;
      });
      return score;
    }

    // 朝・夜のデータからscoresを計算する
    // 朝の記録がない場合はnullを返す
    function calculateScores(morningData, eveningData) {

      // 朝の記録がない場合は計算しない
      if (!morningData) {
        return null;
      }

      return {
        physical:      physicalSignsToScore(morningData.body || []) + physicalSignsToScore(eveningData.body || []),
        mental:        mentalSignsToScore(morningData.mental || []) + mentalSignsToScore(eveningData.mental || []),
        morningEnergy: morningEnergyToScore(morningData.vitality),
        eveningEnergy: eveningEnergyToScore(eveningData.vitality)
      };
    }

    // ============================
    // トースト通知を表示する
    // ============================

    function showToast(message) {
      var toast = document.getElementById('toast');
      toast.textContent = message;
      toast.style.display = 'block';

      // 2秒後に消す
      setTimeout(function() {
        toast.style.display = 'none';
      }, 2000);
    }

    var STORAGE_KEY = 'selfInsightRecords';

    // ============================
    // localStorage への保存・読み込み
    // ============================

    function loadRecords() {
      var data = localStorage.getItem(STORAGE_KEY);
      if (data === null) {
        return [];
      }
      return JSON.parse(data);
    }

    function saveRecord(date, type, data) {
      var records = loadRecords();

      var record = records.find(function(r) {
        return r.date === date;
      });

      if (!record) {

        record = {
          date: date,
          morning: null,
          evening: null,
          scores: {},
          summary: {}
        };

        records.push(record);
      }

      record[type] = data;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    }

    // ============================
    // 天気を取得する関数
    // ============================

    function getLocation() {
      return new Promise(function(resolve, reject) {
        if (!navigator.geolocation) {
          reject('位置情報非対応');
          return;
        }
        navigator.geolocation.getCurrentPosition(
          function(position) {
            resolve({
              lat: position.coords.latitude,
              lon: position.coords.longitude
            });
          },
          function(error) {
            reject('位置情報取得失敗');
          }
        );
      });
    }

    function getWeather(lat, lon) {
      var url = 'https://api.open-meteo.com/v1/forecast'
        + '?latitude=' + lat
        + '&longitude=' + lon
        + '&current=temperature_2m,weathercode,surface_pressure'
        + '&timezone=Asia%2FTokyo';

      return fetch(url)
        .then(function(response) {
          return response.json();
        })
        .then(function(data) {
          return {
            temperature: data.current.temperature_2m,
            weatherCode: data.current.weathercode,
            pressure: data.current.surface_pressure
          };
        });
    }

    function weatherCodeToText(code) {
      if (code === 0)                return '快晴';
      if (code >= 1 && code <= 3)    return '晴れ';
      if (code >= 45 && code <= 48)  return '霧';
      if (code >= 51 && code <= 57)  return '霧雨';
      if (code >= 61 && code <= 67)  return '雨';
      if (code >= 71 && code <= 77)  return '雪';
      if (code >= 80 && code <= 82)  return 'にわか雨';
      if (code >= 85 && code <= 86)  return 'にわか雪';
      if (code >= 95 && code <= 99)  return '雷雨';
      return '不明';
    }

    // ============================
    // 保存ボタンの処理
    // ============================
    document.getElementById('save-btn').addEventListener('click', function() {

      var btn = document.getElementById('save-btn');
      btn.disabled = true;
      btn.textContent = '取得中...';

      // 午前4時未満なら前日扱いにする
      var now = new Date();
      if (now.getHours() < 4) {
        now.setDate(now.getDate() - 1);
      }
      var today = now.getFullYear() + '-'
        + String(now.getMonth() + 1).padStart(2, '0') + '-'
        + String(now.getDate()).padStart(2, '0');

      var record = {
        date: today,
        time: new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }),
        type: 'evening',
        body: getCheckedValues('body[]'),
        mental: getCheckedValues('mental[]'),
        vitality: getRadioValue('vitality'),
        workStartTime: document.getElementById('work-start-time').value,
        workDuration: Number(document.getElementById('work-duration').value) || 0,
        outing: getRadioValue('outing'),

        socializing: getRadioValue('socializing'),
        done: getCheckedValues('done[]'),
        hard: getCheckedValues('hard[]'),
        memo: document.getElementById('memo').value,
        dayRating: getRadioValue('dayRating'),
        weather: null,
        temperature: null,
        pressure: null
      };

      getLocation()
        .then(function(location) {
          return getWeather(location.lat, location.lon);
        })
        .then(function(weather) {
          record.weather = weatherCodeToText(weather.weatherCode);
          record.temperature = weather.temperature;
          record.pressure = weather.pressure;
        })
        .catch(function(error) {
          console.log('天気取得スキップ:', error);
        })
        .finally(function() {
          // 夜のデータを保存する
          saveRecord(
            record.date,
            'evening',
            {
              body: record.body,
              mental: record.mental,
              vitality: record.vitality,

              workStartTime: record.workStartTime,
              workDuration: record.workDuration,
              outing: record.outing,
              socializing: record.socializing,

              done: record.done,
              hard: record.hard,

              memo: record.memo,
              dayRating: record.dayRating,

              weather: record.weather,
              temperature: record.temperature,
              pressure: record.pressure
            }
          );

          // scoresを計算して保存する（朝の記録がある場合のみ）
          var allRecords = loadRecords();
          var todayRecord = allRecords.find(function(r) {
            return r.date === record.date;
          });
          var scores = calculateScores(
            todayRecord ? todayRecord.morning : null,
            record
          );
          if (scores !== null) {
            todayRecord.scores = scores;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(allRecords));
          }

          console.log('保存しました:', record);

          showToast('記録しました！（' + record.date + ' ' + record.time + '）');

          btn.disabled = false;
          btn.textContent = '夜の記録を保存する';

          // ============================
          // AI総評を生成して保存する
          // ============================

          // AI総評の完了（成功・失敗どちらでも）を待つためのPromise
          // 画面遷移をこのPromiseの完了後に行うことで、
          // 生成が終わる前に遷移してしまう問題を防ぐ
          var summaryPromise;


          // 朝の記録があるときだけ実行する
          if (todayRecord && todayRecord.morning) {

            var morningData = todayRecord.morning;
            var eveningData = record;

            // --- 要因の変化をルールで計算する ---

            var morningBody   = morningData.body   || [];
            var eveningBody   = eveningData.body   || [];
            var morningMental = morningData.mental || [];
            var eveningMental = eveningData.mental || [];

            // 消えた体調サイン（朝にあって夜にない）
            var bodyGone = morningBody.filter(function(s) {
              return eveningBody.indexOf(s) === -1;
            });

            // 新しく出た体調サイン（朝になくて夜にある）
            var bodyNew = eveningBody.filter(function(s) {
              return morningBody.indexOf(s) === -1;
            });

            // 継続している体調サイン（朝にも夜にもある）
            var bodyContinued = morningBody.filter(function(s) {
              return eveningBody.indexOf(s) !== -1;
            });

            // 消えたメンタルサイン
            var mentalGone = morningMental.filter(function(s) {
              return eveningMental.indexOf(s) === -1;
            });

            // 新しく出たメンタルサイン
            var mentalNew = eveningMental.filter(function(s) {
              return morningMental.indexOf(s) === -1;
            });

            // 継続しているメンタルサイン
            var mentalContinued = morningMental.filter(function(s) {
              return eveningMental.indexOf(s) !== -1;
            });

            // --- AIに渡すプロンプトを組み立てる ---

            var prompt = '以下は1日の体調・メンタルの記録データです。\n\n';

            prompt += '【朝の状態】\n';
            prompt += '体調：' + (morningBody.length > 0 ? morningBody.join('、') : 'なし') + '\n';
            prompt += 'メンタル：' + (morningMental.length > 0 ? morningMental.join('、') : 'なし') + '\n';
            prompt += '活力：' + (morningData.vitality || 'なし') + '\n\n';

            prompt += '【夜の状態】\n';
            prompt += '体調：' + (eveningBody.length > 0 ? eveningBody.join('、') : 'なし') + '\n';
            prompt += 'メンタル：' + (eveningMental.length > 0 ? eveningMental.join('、') : 'なし') + '\n';
            prompt += '活力：' + (eveningData.vitality || 'なし') + '\n\n';

            prompt += '【朝から夜への変化】\n';
            prompt += '体調で消えたもの：' + (bodyGone.length > 0 ? bodyGone.join('、') : 'なし') + '\n';
            prompt += '体調で新しく出たもの：' + (bodyNew.length > 0 ? bodyNew.join('、') : 'なし') + '\n';
            prompt += '体調で続いているもの：' + (bodyContinued.length > 0 ? bodyContinued.join('、') : 'なし') + '\n';
            prompt += 'メンタルで消えたもの：' + (mentalGone.length > 0 ? mentalGone.join('、') : 'なし') + '\n';
            prompt += 'メンタルで新しく出たもの：' + (mentalNew.length > 0 ? mentalNew.join('、') : 'なし') + '\n';
            prompt += 'メンタルで続いているもの：' + (mentalContinued.length > 0 ? mentalContinued.join('、') : 'なし') + '\n\n';

            prompt += '【今日できたこと】\n';
            prompt += (eveningData.done && eveningData.done.length > 0 ? eveningData.done.join('、') : 'なし') + '\n\n';

            prompt += '上記のデータをもとに、その日の状態を整理した短い文章を日本語で生成してください。\n';
            prompt += '以下のルールを必ず守ってください。\n';
            prompt += '・3文以内にまとめる\n';
            prompt += '・「改善」「悪化」「良い」「悪い」などの評価ワードは使わない\n';
            prompt += '・事実だけを整理する\n';
            prompt += '・励ましや感情的な言葉は不要\n';
            prompt += '・前置きや説明は不要。本文だけ出力する';

            // --- AIを呼び出して文章を生成する ---

            summaryPromise = fetch('https://self-insight-api.gudelove0919.workers.dev/api/summary', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                prompt: prompt
              })
            })
            .then(function(response) {
              return response.json();
            })
            .then(function(data) {
        
              // Anthropicの返答からテキストを取り出す
              var summaryText = '';
              if (data.content && data.content.length > 0) {
                data.content.forEach(function(block) {
                  if (block.type === 'text') {
                    summaryText += block.text;
                  }
                });
              }

              // summary.textとしてlocalStorageに保存する
              if (summaryText) {
                var latestRecords = loadRecords();
                var latestToday = latestRecords.find(function(r) {
                  return r.date === record.date;
                });
                if (latestToday) {
                  latestToday.summary = {
                    generatedAt: new Date().toISOString(),
                    text: summaryText
                  };
                  localStorage.setItem(STORAGE_KEY, JSON.stringify(latestRecords));
                }
              }
            })
            .catch(function(error) {
              console.log('AI総評の生成をスキップしました:', error);
            });
            } else {
              // 朝の記録がない日はAI総評を作らないので、即完了扱いにする
              summaryPromise = Promise.resolve();
            } // AI総評ここまで

            // AI総評の処理が終わってから（成功でも失敗でも）
            // 2秒後に記録一覧へ遷移する（今日の日付を渡す）
            summaryPromise.finally(function() {
              setTimeout(function() {
                window.location.href = 'records.html?date=' + record.date;
              }, 2000);
            });
          });
    });
  </script>

    display: none;

  ">記録しました</div>

      <i class="bi bi-pencil-square" style="font-size:1.2rem; margin-bottom:2px;"></i>
