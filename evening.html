<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>夜の記録 - Self Insight</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f8f9fa;
    }

    /* チェックボックス・ラジオボタンをボタン風にする */
    .sign-btn input[type="checkbox"],
    .sign-btn input[type="radio"] {
      display: none;
    }

    .sign-btn label {
      display: inline-block;
      padding: 6px 14px;
      margin: 4px;
      border: 1px solid #dee2e6;
      border-radius: 20px;
      background-color: #ffffff;
      cursor: pointer;
      font-size: 0.9rem;
      user-select: none;
    }

    .sign-btn input[type="checkbox"]:checked + label,
    .sign-btn input[type="radio"]:checked + label {
      background-color: #0d6efd;
      color: #ffffff;
      border-color: #0d6efd;
    }
  </style>
</head>
<body>

  <div class="container py-4" style="max-width: 600px; padding-bottom: 80px !important;">

    <!-- タイトル -->
    <div class="d-flex justify-content-between align-items-start mb-4">
      <div>
        <h1 class="fs-4 fw-bold mb-1">Self Insight</h1>
        <p class="text-muted mb-0">夜の記録</p>
      </div>
      <a href="index.html" class="btn btn-outline-secondary btn-sm mt-1">朝の記録へ</a>
    </div>

    <!-- 体調サイン -->
    <div class="card mb-3">
      <div class="card-body">
        <h2 class="fs-6 fw-bold mb-3">体調サイン <span class="text-muted fw-normal">（複数選択）</span></h2>
        <div class="sign-btn">
          <span><input type="checkbox" id="b1" name="body[]" value="問題なし"><label for="b1">問題なし</label></span>
          <span><input type="checkbox" id="b2" name="body[]" value="身体が軽い"><label for="b2">身体が軽い</label></span>
          <span><input type="checkbox" id="b3" name="body[]" value="眠い"><label for="b3">眠い</label></span>
          <span><input type="checkbox" id="b4" name="body[]" value="だるい"><label for="b4">だるい</label></span>
          <span><input type="checkbox" id="b5" name="body[]" value="強い疲労感"><label for="b5">強い疲労感</label></span>
          <span><input type="checkbox" id="b6" name="body[]" value="目の疲れ"><label for="b6">目の疲れ</label></span>
          <span><input type="checkbox" id="b7" name="body[]" value="頭痛"><label for="b7">頭痛</label></span>
          <span><input type="checkbox" id="b8" name="body[]" value="肩こり・首こり"><label for="b8">肩こり・首こり</label></span>
          <span><input type="checkbox" id="b9" name="body[]" value="食欲不振"><label for="b9">食欲不振</label></span>
          <span><input type="checkbox" id="b10" name="body[]" value="過食"><label for="b10">過食</label></span>
        </div>
      </div>
    </div>

    <!-- メンタルサイン -->
    <div class="card mb-3">
      <div class="card-body">
        <h2 class="fs-6 fw-bold mb-3">メンタルサイン <span class="text-muted fw-normal">（複数選択）</span></h2>
        <div class="sign-btn">
          <span><input type="checkbox" id="m1" name="mental[]" value="穏やか"><label for="m1">穏やか</label></span>
          <span><input type="checkbox" id="m2" name="mental[]" value="前向き"><label for="m2">前向き</label></span>
          <span><input type="checkbox" id="m3" name="mental[]" value="不安"><label for="m3">不安</label></span>
          <span><input type="checkbox" id="m4" name="mental[]" value="落ち込み"><label for="m4">落ち込み</label></span>
          <span><input type="checkbox" id="m5" name="mental[]" value="イライラ"><label for="m5">イライラ</label></span>
          <span><input type="checkbox" id="m6" name="mental[]" value="焦り"><label for="m6">焦り</label></span>
          <span><input type="checkbox" id="m7" name="mental[]" value="無気力"><label for="m7">無気力</label></span>
          <span><input type="checkbox" id="m8" name="mental[]" value="緊張"><label for="m8">緊張</label></span>
          <span><input type="checkbox" id="m9" name="mental[]" value="考えがまとまらない"><label for="m9">考えがまとまらない</label></span>
          <span><input type="checkbox" id="m10" name="mental[]" value="集中しにくい"><label for="m10">集中しにくい</label></span>
          <span><input type="checkbox" id="m11" name="mental[]" value="憂鬱"><label for="m11">憂鬱</label></span>
        </div>
      </div>
    </div>

    <!-- 活力サイン -->
    <div class="card mb-3">
      <div class="card-body">
        <h2 class="fs-6 fw-bold mb-3">活力サイン <span class="text-muted fw-normal">（1つ選択）</span></h2>
        <div class="sign-btn">
          <span><input type="radio" id="v1" name="vitality" value="想定以上に動けた"><label for="v1">想定以上に動けた</label></span>
          <span><input type="radio" id="v2" name="vitality" value="普段通りに動けた"><label for="v2">普段通りに動けた</label></span>
          <span><input type="radio" id="v3" name="vitality" value="最低限は動けた"><label for="v3">最低限は動けた</label></span>
          <span><input type="radio" id="v4" name="vitality" value="ほとんど動けなかった"><label for="v4">ほとんど動けなかった</label></span>
        </div>
      </div>
    </div>

    <!-- 行動 -->
    <div class="card mb-3">
      <div class="card-body">
        <h2 class="fs-6 fw-bold mb-3">行動</h2>

        <!-- 作業時間 -->
        <div class="mb-3">
          <label for="work-hours" class="form-label">作業時間</label>
          <div class="d-flex align-items-center gap-2">
            <input type="number" id="work-hours" class="form-control" style="width: 80px;"
              min="0" max="24" step="0.5" placeholder="0">
            <span class="text-muted">時間</span>
          </div>
        </div>

        <!-- 外出 -->
        <div class="mb-3">
          <label class="form-label">外出</label>
          <div class="sign-btn">
            <span><input type="radio" id="go1" name="outing" value="した"><label for="go1">した</label></span>
            <span><input type="radio" id="go2" name="outing" value="しなかった"><label for="go2">しなかった</label></span>
          </div>
        </div>

        <!-- 人との交流 -->
        <div>
          <label class="form-label">人との交流</label>
          <div class="sign-btn">
            <span><input type="radio" id="s1" name="socializing" value="あった"><label for="s1">あった</label></span>
            <span><input type="radio" id="s2" name="socializing" value="なかった"><label for="s2">なかった</label></span>
          </div>
        </div>

      </div>
    </div>

    <!-- 今日できたこと -->
    <div class="card mb-3">
      <div class="card-body">
        <h2 class="fs-6 fw-bold mb-3">今日できたこと <span class="text-muted fw-normal">（複数選択）</span></h2>
        <div class="sign-btn">
          <span><input type="checkbox" id="d1" name="done[]" value="作業できた"><label for="d1">作業できた</label></span>
          <span><input type="checkbox" id="d2" name="done[]" value="外出できた"><label for="d2">外出できた</label></span>
          <span><input type="checkbox" id="d3" name="done[]" value="人と話せた"><label for="d3">人と話せた</label></span>
          <span><input type="checkbox" id="d4" name="done[]" value="家事できた"><label for="d4">家事できた</label></span>
          <span><input type="checkbox" id="d5" name="done[]" value="趣味ができた"><label for="d5">趣味ができた</label></span>
          <span><input type="checkbox" id="d6" name="done[]" value="ゆっくり休めた"><label for="d6">ゆっくり休めた</label></span>
        </div>
      </div>
    </div>

    <!-- 今日大変だったこと -->
    <div class="card mb-3">
      <div class="card-body">
        <h2 class="fs-6 fw-bold mb-3">今日大変だったこと <span class="text-muted fw-normal">（複数選択）</span></h2>
        <div class="sign-btn">
          <span><input type="checkbox" id="h1" name="hard[]" value="疲れた"><label for="h1">疲れた</label></span>
          <span><input type="checkbox" id="h2" name="hard[]" value="不安が強い"><label for="h2">不安が強い</label></span>
          <span><input type="checkbox" id="h3" name="hard[]" value="落ち込み"><label for="h3">落ち込み</label></span>
          <span><input type="checkbox" id="h4" name="hard[]" value="人間関係"><label for="h4">人間関係</label></span>
          <span><input type="checkbox" id="h5" name="hard[]" value="睡眠不足"><label for="h5">睡眠不足</label></span>
          <span><input type="checkbox" id="h6" name="hard[]" value="体調不良"><label for="h6">体調不良</label></span>
          <span><input type="checkbox" id="h7" name="hard[]" value="仕事のストレス"><label for="h7">仕事のストレス</label></span>
        </div>
      </div>
    </div>

    <!-- 補足メモ -->
    <div class="card mb-4">
      <div class="card-body">
        <h2 class="fs-6 fw-bold mb-3">補足メモ <span class="text-muted fw-normal">（自由記述）</span></h2>
        <textarea id="memo" class="form-control" rows="4" placeholder="今日のことを自由に書いてください"></textarea>
      </div>
    </div>

    <!-- 保存ボタン -->
    <button type="button" class="btn btn-primary w-100" id="save-btn">
      夜の記録を保存する
    </button>

  </div><!-- /container -->

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // ============================
    // フォームの値を取得する関数
    // ============================

    function getCheckedValues(name) {
      var checkboxes = document.querySelectorAll('input[name="' + name + '"]:checked');
      var values = [];
      checkboxes.forEach(function(cb) {
        values.push(cb.value);
      });
      return values;
    }

    function getRadioValue(name) {
      var radio = document.querySelector('input[name="' + name + '"]:checked');
      return radio ? radio.value : null;
    }

    // ============================
    // スコア計算の関数
    // ============================

    // 朝の活力をスコアに変換する
    function morningEnergyToScore(vitality) {
      if (vitality === 'いつもより動けそう')      return 2;
      if (vitality === 'いつも通りのことはできる') return 1;
      if (vitality === '少し頑張れば動ける')       return -1;
      if (vitality === '何もしたくない')           return -2;
      return null;
    }

    // 夜の活力をスコアに変換する
    function eveningEnergyToScore(vitality) {
      if (vitality === '想定以上に動けた')     return 2;
      if (vitality === '普段通りに動けた')     return 1;
      if (vitality === '最低限は動けた')       return -1;
      if (vitality === 'ほとんど動けなかった') return -2;
      return null;
    }

    // メンタルサインをスコアに変換する（配列を受け取って合計を返す）
    function mentalSignsToScore(signs) {
      var GOOD  = ['穏やか', '前向き'];
      var BAD   = ['不安', '焦り', '落ち込み', '憂鬱', '無気力', 'イライラ', '緊張', '集中しにくい', '考えがまとまらない'];
      var score = 0;
      signs.forEach(function(sign) {
        if (GOOD.indexOf(sign) !== -1) score += 1;
        if (BAD.indexOf(sign)  !== -1) score -= 1;
      });
      return score;
    }

    // 体調サインをスコアに変換する（配列を受け取って合計を返す）
    function physicalSignsToScore(signs) {
      var GOOD = ['問題なし', '身体が軽い'];
      var BAD  = ['眠い', 'だるい', '強い疲労感', '目の疲れ', '頭痛', '肩こり・首こり', '食欲不振', '過食'];
      var score = 0;
      signs.forEach(function(sign) {
        if (GOOD.indexOf(sign) !== -1) score += 1;
        if (BAD.indexOf(sign)  !== -1) score -= 1;
      });
      return score;
    }

    // 朝・夜のデータからscoresを計算する
    // 朝の記録がない場合はnullを返す
    function calculateScores(morningData, eveningData) {

      // 朝の記録がない場合は計算しない
      if (!morningData) {
        return null;
      }

      return {
        physical:      physicalSignsToScore(morningData.body || []) + physicalSignsToScore(eveningData.body || []),
        mental:        mentalSignsToScore(morningData.mental || []) + mentalSignsToScore(eveningData.mental || []),
        morningEnergy: morningEnergyToScore(morningData.vitality),
        eveningEnergy: eveningEnergyToScore(eveningData.vitality)
      };
    }

    // ============================
    // トースト通知を表示する
    // ============================

    function showToast(message) {
      var toast = document.getElementById('toast');
      toast.textContent = message;
      toast.style.display = 'block';

      // 2秒後に消す
      setTimeout(function() {
        toast.style.display = 'none';
      }, 2000);
    }

    var STORAGE_KEY = 'selfInsightRecords';

    // ============================
    // localStorage への保存・読み込み
    // ============================

    function loadRecords() {
      var data = localStorage.getItem(STORAGE_KEY);
      if (data === null) {
        return [];
      }
      return JSON.parse(data);
    }

    function saveRecord(date, type, data) {
      var records = loadRecords();

      var record = records.find(function(r) {
        return r.date === date;
      });

      if (!record) {

        record = {
          date: date,
          morning: null,
          evening: null,
          scores: {},
          summary: {}
        };

        records.push(record);
      }

      record[type] = data;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    }

    // ============================
    // 天気を取得する関数
    // ============================

    function getLocation() {
      return new Promise(function(resolve, reject) {
        if (!navigator.geolocation) {
          reject('位置情報非対応');
          return;
        }
        navigator.geolocation.getCurrentPosition(
          function(position) {
            resolve({
              lat: position.coords.latitude,
              lon: position.coords.longitude
            });
          },
          function(error) {
            reject('位置情報取得失敗');
          }
        );
      });
    }

    function getWeather(lat, lon) {
      var url = 'https://api.open-meteo.com/v1/forecast'
        + '?latitude=' + lat
        + '&longitude=' + lon
        + '&current=temperature_2m,weathercode,surface_pressure'
        + '&timezone=Asia%2FTokyo';

      return fetch(url)
        .then(function(response) {
          return response.json();
        })
        .then(function(data) {
          return {
            temperature: data.current.temperature_2m,
            weatherCode: data.current.weathercode,
            pressure: data.current.surface_pressure
          };
        });
    }

    function weatherCodeToText(code) {
      if (code === 0)                return '快晴';
      if (code >= 1 && code <= 3)    return '晴れ';
      if (code >= 45 && code <= 48)  return '霧';
      if (code >= 51 && code <= 57)  return '霧雨';
      if (code >= 61 && code <= 67)  return '雨';
      if (code >= 71 && code <= 77)  return '雪';
      if (code >= 80 && code <= 82)  return 'にわか雨';
      if (code >= 85 && code <= 86)  return 'にわか雪';
      if (code >= 95 && code <= 99)  return '雷雨';
      return '不明';
    }

    // ============================
    // 保存ボタンの処理
    // ============================
    document.getElementById('save-btn').addEventListener('click', function() {

      var btn = document.getElementById('save-btn');
      btn.disabled = true;
      btn.textContent = '取得中...';

      // 午前4時未満なら前日扱いにする
      var now = new Date();
      if (now.getHours() < 4) {
        now.setDate(now.getDate() - 1);
      }
      var today = now.getFullYear() + '-'
        + String(now.getMonth() + 1).padStart(2, '0') + '-'
        + String(now.getDate()).padStart(2, '0');

      var record = {
        date: today,
        time: new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }),
        type: 'evening',
        body: getCheckedValues('body[]'),
        mental: getCheckedValues('mental[]'),
        vitality: getRadioValue('vitality'),
        workHours: Number(document.getElementById('work-hours').value),
        outing: getRadioValue('outing'),
        socializing: getRadioValue('socializing'),
        done: getCheckedValues('done[]'),
        hard: getCheckedValues('hard[]'),
        memo: document.getElementById('memo').value,
        weather: null,
        temperature: null,
        pressure: null
      };

      getLocation()
        .then(function(location) {
          return getWeather(location.lat, location.lon);
        })
        .then(function(weather) {
          record.weather = weatherCodeToText(weather.weatherCode);
          record.temperature = weather.temperature;
          record.pressure = weather.pressure;
        })
        .catch(function(error) {
          console.log('天気取得スキップ:', error);
        })
        .finally(function() {
          // 夜のデータを保存する
          saveRecord(
            record.date,
            'evening',
            {
              body: record.body,
              mental: record.mental,
              vitality: record.vitality,

              workHours: record.workHours,
              outing: record.outing,
              socializing: record.socializing,

              done: record.done,
              hard: record.hard,

              memo: record.memo,

              weather: record.weather,
              temperature: record.temperature,
              pressure: record.pressure
            }
          );

          // scoresを計算して保存する（朝の記録がある場合のみ）
          var allRecords = loadRecords();
          var todayRecord = allRecords.find(function(r) {
            return r.date === record.date;
          });
          var scores = calculateScores(
            todayRecord ? todayRecord.morning : null,
            record
          );
          if (scores !== null) {
            todayRecord.scores = scores;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(allRecords));
          }

          console.log('保存しました:', record);

          showToast('記録しました！（' + record.date + ' ' + record.time + '）');

          btn.disabled = false;
          btn.textContent = '夜の記録を保存する';

          // ============================
          // AI総評を生成して保存する
          // ============================

          // 朝の記録があるときだけ実行する
          if (todayRecord && todayRecord.morning) {

            var morningData = todayRecord.morning;
            var eveningData = record;

            // --- 要因の変化をルールで計算する ---

            var morningBody   = morningData.body   || [];
            var eveningBody   = eveningData.body   || [];
            var morningMental = morningData.mental || [];
            var eveningMental = eveningData.mental || [];

            // 消えた体調サイン（朝にあって夜にない）
            var bodyGone = morningBody.filter(function(s) {
              return eveningBody.indexOf(s) === -1;
            });

            // 新しく出た体調サイン（朝になくて夜にある）
            var bodyNew = eveningBody.filter(function(s) {
              return morningBody.indexOf(s) === -1;
            });

            // 継続している体調サイン（朝にも夜にもある）
            var bodyContinued = morningBody.filter(function(s) {
              return eveningBody.indexOf(s) !== -1;
            });

            // 消えたメンタルサイン
            var mentalGone = morningMental.filter(function(s) {
              return eveningMental.indexOf(s) === -1;
            });

            // 新しく出たメンタルサイン
            var mentalNew = eveningMental.filter(function(s) {
              return morningMental.indexOf(s) === -1;
            });

            // 継続しているメンタルサイン
            var mentalContinued = morningMental.filter(function(s) {
              return eveningMental.indexOf(s) !== -1;
            });

            // --- ルールベースでAI総評テキストを生成する ---

            // 文章のパーツを入れる配列
            var sentences = [];

            // --- 1文目：朝の状態 ---
            var morningSigns = [];
            if (morningBody.length > 0)   morningSigns.push('体調は' + morningBody.join('・'));
            if (morningMental.length > 0) morningSigns.push('メンタルは' + morningMental.join('・'));

            if (morningSigns.length > 0) {
              sentences.push('朝の' + morningSigns.join('、') + 'の状態でした。');
            } else {
              sentences.push('朝のサイン記録はありませんでした。');
            }

            // --- 2文目：夜との変化 ---
            var changeParts = [];

            // 消えたサイン
            var allGone = bodyGone.concat(mentalGone);
            if (allGone.length > 0) {
              changeParts.push(allGone.join('・') + 'は夜には見られなくなりました');
            }

            // 新しく出たサイン
            var allNew = bodyNew.concat(mentalNew);
            if (allNew.length > 0) {
              changeParts.push('夜には' + allNew.join('・') + 'が加わりました');
            }

            // 継続しているサイン
            var allContinued = bodyContinued.concat(mentalContinued);
            if (allContinued.length > 0 && allGone.length === 0 && allNew.length === 0) {
              changeParts.push(allContinued.join('・') + 'が続いています');
            }

            if (changeParts.length > 0) {
              sentences.push(changeParts.join('。') + '。');
            } else if (eveningBody.length === 0 && eveningMental.length === 0) {
              sentences.push('夜のサイン記録はありませんでした。');
            } else {
              sentences.push('朝から夜にかけて状態に大きな変化はありませんでした。');
            }

            // --- 3文目：今日できたこと ---
            var doneList = eveningData.done || [];
            if (doneList.length > 0) {
              sentences.push(doneList.join('・') + 'が記録されています。');
            }

            // --- 4文目：前日との比較 ---

            // 前日の日付を計算する
            var todayDate = new Date(record.date);
            todayDate.setDate(todayDate.getDate() - 1);
            var yesterdayString =
              todayDate.getFullYear() + '-' +
              String(todayDate.getMonth() + 1).padStart(2, '0') + '-' +
              String(todayDate.getDate()).padStart(2, '0');

            // 前日のレコードを探す
            var allRecords = loadRecords();
            var yesterdayRecord = allRecords.find(function(r) {
              return r.date === yesterdayString;
            });

            // 前日の夜のサインがある場合だけ比較する
            if (yesterdayRecord && yesterdayRecord.evening) {

              var yesterdayBody   = yesterdayRecord.evening.body   || [];
              var yesterdayMental = yesterdayRecord.evening.mental || [];
              var yesterdayHard   = yesterdayRecord.evening.hard   || [];

              // 当日の夜のサイン
              var todayBody   = eveningData.body   || [];
              var todayMental = eveningData.mental || [];
              var todayHard   = eveningData.hard   || [];

              // 前日から消えたもの
              var disappearedBody   = yesterdayBody.filter(function(s) {
                return todayBody.indexOf(s) === -1;
              });
              var disappearedMental = yesterdayMental.filter(function(s) {
                return todayMental.indexOf(s) === -1;
              });
              var disappearedHard   = yesterdayHard.filter(function(s) {
                return todayHard.indexOf(s) === -1;
              });

              // 前日から新しく出たもの
              var appearedBody   = todayBody.filter(function(s) {
                return yesterdayBody.indexOf(s) === -1;
              });
              var appearedMental = todayMental.filter(function(s) {
                return yesterdayMental.indexOf(s) === -1;
              });
              var appearedHard   = todayHard.filter(function(s) {
                return yesterdayHard.indexOf(s) === -1;
              });

              // 前日から継続しているもの
              var continuedBody   = todayBody.filter(function(s) {
                return yesterdayBody.indexOf(s) !== -1;
              });
              var continuedMental = todayMental.filter(function(s) {
                return yesterdayMental.indexOf(s) !== -1;
              });
              var continuedHard   = todayHard.filter(function(s) {
                return yesterdayHard.indexOf(s) !== -1;
              });

              // 前日比較の文章を作る
              var yesterdayParts = [];

              var allDisappeared = disappearedBody.concat(disappearedMental).concat(disappearedHard);
              var allAppeared    = appearedBody.concat(appearedMental).concat(appearedHard);
              var allContinued   = continuedBody.concat(continuedMental).concat(continuedHard);

              if (allDisappeared.length > 0) {
                yesterdayParts.push(allDisappeared.join('・') + 'は前日から解消されました');
              }
              if (allAppeared.length > 0) {
                yesterdayParts.push(allAppeared.join('・') + 'が新たに記録されました');
              }
              if (allContinued.length > 0) {
                yesterdayParts.push(allContinued.join('・') + 'が継続して記録されています');
              }

              if (yesterdayParts.length > 0) {
                sentences.push('\n' + yesterdayParts.join('。') + '。');
              }
            }

            // --- テキストをつなげる ---
            var summaryText = sentences.join('');

            // --- summary.textとしてlocalStorageに保存する ---
            if (summaryText) {
              var latestRecords = loadRecords();
              var latestToday = latestRecords.find(function(r) {
                return r.date === record.date;
              });
              if (latestToday) {
                latestToday.summary = {
                  generatedAt: new Date().toISOString(),
                  text: summaryText
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(latestRecords));
              }
            }
          }
          // 2秒後に記録一覧へ遷移する（今日の日付を渡す）
          setTimeout(function() {
            window.location.href = 'records.html?date=' + record.date;
          }, 2000);
        });
    });
  </script>
