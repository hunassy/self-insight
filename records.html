<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>記録一覧 - Self Insight</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div class="container py-4" style="max-width: 600px;">

    <!-- タイトル -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h1 class="fs-4 fw-bold mb-1">Self Insight</h1>
        <p class="text-muted mb-0">記録一覧</p>
      </div>
      <div class="d-flex gap-2">
        <a href="analysis.html" class="btn btn-outline-secondary btn-sm">分析</a>
        <a href="admin.html" class="btn btn-outline-secondary btn-sm">管理</a>
        <a href="index.html" class="btn btn-outline-primary btn-sm">＋ 記録する</a>
      </div>
    </div>

    <!-- 記録一覧 -->
    <div id="calendar-container"></div>

    <!-- 記録の詳細表示エリア -->
    <div id="record-detail" class="mt-3"></div>

    <!-- 記録がない場合のメッセージ -->
    <div id="empty-message" style="display: none;">
      <div class="text-center text-muted py-5">
        <p>まだ記録がありません</p>
        <a href="index.html" class="btn btn-primary">最初の記録をする</a>
      </div>
    </div>

  </div><!-- /container -->

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // ============================
    // localStorageからデータを読む
    // ============================

    var STORAGE_KEY = 'selfInsightRecords';

    function loadRecords() {
      var data = localStorage.getItem(STORAGE_KEY);
      if (data === null) {
        return [];
      }
      return JSON.parse(data);
    }

    // ============================
    // 記録の状態を表す文字を返す
    // ============================
    function getRecordStatus(record) {

      if (record.morning && record.evening) {
        return '◎';
      }

      if (record.morning || record.evening) {
        return '〇';
      }

      return '';
    }

    // ============================
    // 表示中の年月を管理する
    // ============================

    var currentYear  = new Date().getFullYear();
    var currentMonth = new Date().getMonth();

    // 前月へ移動する
    function goToPrevMonth() {
      currentMonth--;
      if (currentMonth < 0) {
        currentMonth = 11;
        currentYear--;
      }
      renderCalendar(loadRecords());
    }

    // 翌月へ移動する
    function goToNextMonth() {
      currentMonth++;
      if (currentMonth > 11) {
        currentMonth = 0;
        currentYear++;
      }
      renderCalendar(loadRecords());
    }

    // ============================
    // カレンダーを描画する
    // ============================
    function renderCalendar(records) {

      var container = document.getElementById('calendar-container');

      var year  = currentYear;
      var month = currentMonth;

      var firstDay = new Date(year, month, 1);
      var lastDay = new Date(year, month + 1, 0);

      var startWeekday = firstDay.getDay();
      var daysInMonth = lastDay.getDate();

      var html = '';

      html += `
        <div class="card">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <button class="btn btn-outline-secondary btn-sm" onclick="goToPrevMonth()">＜</button>
              <h5 class="mb-0">${year}年${month + 1}月</h5>
              <button class="btn btn-outline-secondary btn-sm" onclick="goToNextMonth()">＞</button>
            </div>

            <table class="table table-bordered text-center align-middle">
              <thead>
                <tr>
                  <th>日</th>
                  <th>月</th>
                  <th>火</th>
                  <th>水</th>
                  <th>木</th>
                  <th>金</th>
                  <th>土</th>
                </tr>
              </thead>
              <tbody>
      `;

      var day = 1;

      for (var row = 0; row < 6; row++) {

        html += '<tr>';

        for (var col = 0; col < 7; col++) {

          if (
            (row === 0 && col < startWeekday) ||
            day > daysInMonth
          ) {

            html += '<td></td>';

          } else {

            var dateString =
              year + '-' +
              String(month + 1).padStart(2, '0') + '-' +
              String(day).padStart(2, '0');

            var record = records.find(function(r) {
              return r.date === dateString;
            });

            var status = record
              ? getRecordStatus(record)
              : '';

            html += `
              <td
                style="cursor:pointer;"
                onclick="showRecordDetail('${dateString}')"
              >
                <div>${day}</div>
                <div>${status}</div>
              </td>
            `;

            day++;
          }
        }

        html += '</tr>';

        if (day > daysInMonth) {
          break;
        }
      }

      html += `
              </tbody>
            </table>
          </div>
        </div>
      `;

      container.innerHTML = html;
    }


    // ============================
    // 日付をクリックしたときに記録の詳細を表示する
    // ============================

    function listToHtml(arr) {

      if (!arr || arr.length === 0) {
        return '<div class="text-muted">なし</div>';
      }

      return arr.map(function(item) {
        return '<div>・' + item + '</div>';
      }).join('');
    }

    function vitalityToScore(vitality) {

      switch (vitality) {

        case 'いつもより動けそう':
        case '想定以上に動けた':
          return 3;

        case 'いつも通りのことはできる':
        case '普段通りに動けた':
          return 2;

        case '少し頑張れば動ける':
        case '最低限は動けた':
          return 1;

        case '何もしたくない':
        case 'ほとんど動けなかった':
          return 0;

        default:
          return null;
      }
    }

    function getVitalityChange(record) {

      if (!record.morning || !record.evening) {
        return '比較不可';
      }

      var morningScore = vitalityToScore(record.morning.vitality);
      var eveningScore = vitalityToScore(record.evening.vitality);

      if (morningScore === null || eveningScore === null) {
        return '比較不可';
      }

      if (eveningScore > morningScore) {
        return '上昇';
      }

      if (eveningScore < morningScore) {
        return '低下';
      }

      return '変化なし';
    }

    function generateDailySummary(record) {

      if (!record.evening) {
        return null;
      }

      return {
        body: {
          morning: record.morning?.body || [],
          evening: record.evening?.body || []
        },

        mental: {
          morning: record.morning?.mental || [],
          evening: record.evening?.mental || []
        },

        vitality: record.evening.vitality,

        workHours: record.evening.workHours || 0,
        outing: record.evening.outing || '未記録',
        socializing: record.evening.socializing || '未記録',

        doneCount: (record.evening.done || []).length,
        hardCount: (record.evening.hard || []).length,

        vitalityChange: getVitalityChange(record)
      };
    }
    
    function showRecordDetail(dateString) {

      var records = loadRecords();

      var record = records.find(function(r) {
        return r.date === dateString;
      });

      var container = document.getElementById('record-detail');

      if (!record) {
        container.innerHTML = `
          <div class="card">
            <div class="card-body">
              <h5>${dateString}</h5>
              <p class="text-muted mb-0">記録なし</p>
            </div>
          </div>
        `;
        return;
      }

      // 今日のまとめ用：体調変化を計算する
      function getPhysicalChange(record) {
        if (!record.morning || !record.evening) return '比較不可';
        var GOOD = ['問題なし', '身体が軽い'];
        var BAD  = ['眠い', 'だるい', '強い疲労感', '目の疲れ', '頭痛', '肩こり・首こり', '食欲不振', '過食'];
        var morningScore = 0;
        var eveningScore = 0;
        (record.morning.body || []).forEach(function(s) {
          if (GOOD.indexOf(s) !== -1) morningScore += 1;
          if (BAD.indexOf(s)  !== -1) morningScore -= 1;
        });
        (record.evening.body || []).forEach(function(s) {
          if (GOOD.indexOf(s) !== -1) eveningScore += 1;
          if (BAD.indexOf(s)  !== -1) eveningScore -= 1;
        });
        if (eveningScore > morningScore) return '改善傾向';
        if (eveningScore < morningScore) return '悪化傾向';
        return '変化なし';
      }

      // 今日のまとめ用：メンタル変化を計算する
      function getMentalChange(record) {
        if (!record.morning || !record.evening) return '比較不可';
        var GOOD = ['穏やか', '前向き'];
        var BAD  = ['不安', '焦り', '落ち込み', '憂鬱', '無気力', 'イライラ', '緊張', '集中しにくい', '考えがまとまらない'];
        var morningScore = 0;
        var eveningScore = 0;
        (record.morning.mental || []).forEach(function(s) {
          if (GOOD.indexOf(s) !== -1) morningScore += 1;
          if (BAD.indexOf(s)  !== -1) morningScore -= 1;
        });
        (record.evening.mental || []).forEach(function(s) {
          if (GOOD.indexOf(s) !== -1) eveningScore += 1;
          if (BAD.indexOf(s)  !== -1) eveningScore -= 1;
        });
        if (eveningScore > morningScore) return '改善傾向';
        if (eveningScore < morningScore) return '悪化傾向';
        return '変化なし';
      }

      // 朝・夜のサインを2列で表示するHTML
      function twoColumnList(morningArr, eveningArr) {
        var maxLen = Math.max((morningArr || []).length, (eveningArr || []).length);
        if (maxLen === 0) return '<div class="text-muted">なし</div>';
        var html = '';
        for (var i = 0; i < maxLen; i++) {
          var m = morningArr && morningArr[i] ? '・' + morningArr[i] : '';
          var e = eveningArr && eveningArr[i] ? '・' + eveningArr[i] : '';
          html += `
            <div class="row">
              <div class="col-6">${m}</div>
              <div class="col-6">${e}</div>
            </div>
          `;
        }
        return html;
      }

      // 今日のまとめHTML（朝の記録がない場合は表示しない）
      var summaryHtml = '';
      if (record.morning && record.evening) {
        summaryHtml = `
          <div class="mb-3">
            <h5 class="fw-bold mb-3">今日のまとめ</h5>

            <div class="mb-3">
              <div class="fw-bold mb-1">＜状態＞</div>

              <div class="mb-2">
                <div class="fw-bold small mb-1">体調</div>
                <div class="row text-muted small mb-1">
                  <div class="col-6">朝</div>
                  <div class="col-6">夜</div>
                </div>
                ${twoColumnList(record.morning.body, record.evening.body)}
                <div class="small mt-1">変化：${getPhysicalChange(record)}</div>
              </div>

              <div class="mb-2">
                <div class="fw-bold small mb-1">メンタル</div>
                <div class="row text-muted small mb-1">
                  <div class="col-6">朝</div>
                  <div class="col-6">夜</div>
                </div>
                ${twoColumnList(record.morning.mental, record.evening.mental)}
                <div class="small mt-1">変化：${getMentalChange(record)}</div>
              </div>

              <div class="mb-2">
                <div class="fw-bold small mb-1">活力</div>
                <div class="row text-muted small mb-1">
                  <div class="col-6">朝</div>
                  <div class="col-6">夜</div>
                </div>
                <div class="row">
                  <div class="col-6">・${record.morning.vitality || '-'}</div>
                  <div class="col-6">・${record.evening.vitality || '-'}</div>
                </div>
                <div class="small mt-1">変化：${getVitalityChange(record)}</div>
              </div>
            </div>

            <div class="mb-3">
              <div class="fw-bold mb-1">＜行動＞</div>
              <div>作業時間：${record.evening.workHours || 0}時間</div>
              <div>外出：${record.evening.outing || '-'}</div>
              <div>交流：${record.evening.socializing || '-'}</div>
            </div>

            <div>
              <div class="fw-bold mb-1">＜出来事＞</div>
              <div>できたこと：${(record.evening.done || []).length}件
                ${(record.evening.done || []).length > 0
                  ? '<div class="text-muted small">' + record.evening.done.map(function(d) { return '・' + d; }).join('<br>') + '</div>'
                  : ''}
              </div>
              <div class="mt-1">大変だったこと：${(record.evening.hard || []).length}件
                ${(record.evening.hard || []).length > 0
                  ? '<div class="text-muted small">' + record.evening.hard.map(function(d) { return '・' + d; }).join('<br>') + '</div>'
                  : ''}
              </div>
            </div>
            ${record.summary && record.summary.text
              ? `<div class="mt-3">
                  <div class="fw-bold mb-1">AI総評</div>
                  <div class="text-muted small">
                    ${record.summary.text
                      .split('\n')
                      .map(function(part) {
                        return part ? '<div>' + part + '</div>' : '';
                      })
                      .join('<div class="mt-2"></div>')
                    }
                  </div>
                </div>`
              : ''
            }
          </div>
          <hr>
        `;
      }
      container.innerHTML = `
        <div class="card">
          <div class="card-body">
            <h5 class="mb-3">${dateString}</h5>
            ${summaryHtml}
          </div>
        </div>
      `;
    }
    
    // ============================
    // ページ読み込み時に記録を表示する
    // ============================

    var records = loadRecords();

    renderCalendar(records);

    // URLに日付が含まれている場合は自動的に詳細を表示する
    // 例：records.html?date=2026-06-06
    var urlParams = new URLSearchParams(window.location.search);
    var dateFromUrl = urlParams.get('date');
    if (dateFromUrl) {
      showRecordDetail(dateFromUrl);
    }

  </script>

</body>
</html>
